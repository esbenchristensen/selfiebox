<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Selfi erhverv</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="shared.css">
<style>
/* The film for bars, pubs and nightclubs (selfi.dk/erhverv). Written as an ad: the loss first
   (a full Friday, and on Monday nobody knows who was there), then how the box gets guests going and
   turns that into a phone number, sales at the bar and paid prints, then the service, the price and
   one thing to do. The venues are made up on purpose, so no real bar looks like a customer. */

/* A box in a venue's design: wings on the sides, a sign on top, its own casing, ring and screen */
.vbox { position: relative; isolation: isolate; width: var(--bw); flex: none; margin-top: calc(var(--bw) * 0.3); container-type: inline-size; }
.vbox .shell { fill: var(--casing, #0a0a0a); }
.vbox .notch { fill: var(--casing, #0a0a0a); }
.wing { position: absolute; top: 9%; height: 82%; width: 27%; z-index: -1; border-radius: 10cqw; background: linear-gradient(180deg, var(--w1), var(--w2)); box-shadow: inset 0 0 0 1.3cqw var(--acc), 0 30px 60px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; padding: 8cqw 0; }
.wing.l { right: 84%; padding-right: 4cqw; }
.wing.r { left: 84%; padding-left: 4cqw; }
.wing i { display: block; }
.bulbs .wing i, .bulbs .topper i { width: 3.6cqw; height: 3.6cqw; border-radius: 50%; background: #ffe7a8; box-shadow: 0 0 2.4cqw #ffcf6a; }
.waves .wing i { width: 10cqw; height: 4cqw; border-top: 1.1cqw solid var(--acc); border-radius: 50% 50% 0 0; opacity: 0.85; }
.leaves .wing i { width: 7cqw; height: 11cqw; border-radius: 0 100% 0 100%; background: var(--acc); transform: rotate(-20deg); opacity: 0.9; }
.leaves .wing i:nth-child(even) { transform: rotate(70deg); background: #7fd05a; }
.topper { position: absolute; left: -12%; width: 124%; bottom: 95%; height: 30cqw; z-index: -1; border-radius: 9cqw 9cqw 4cqw 4cqw; background: linear-gradient(180deg, var(--w2), var(--w1)); box-shadow: inset 0 0 0 1.3cqw var(--acc), 0 30px 60px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.6cqw; padding-bottom: 3cqw; }
.topper b { font: 600 11cqw/1 var(--display); letter-spacing: 0.02em; color: var(--acc); }
.topper small { font: 500 4.2cqw/1 var(--mono); letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink2); }
.topper .row { position: absolute; left: 7cqw; right: 7cqw; display: flex; justify-content: space-between; }
.topper .row.t { top: 3cqw; }
.topper .row.b { bottom: 3cqw; }
.leaves .topper::before, .leaves .topper::after { content: ""; position: absolute; top: -7cqw; width: 22cqw; height: 14cqw; border-radius: 50%; background: #2c6b47; z-index: -1; }
.leaves .topper::before { left: 6cqw; } .leaves .topper::after { right: 6cqw; background: #3f8f3a; }
.vscreen { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3.5cqw; padding: 6cqw; text-align: center; }
.vscreen .sg { font: 600 5cqw/1 var(--mono); letter-spacing: 0.18em; }
.vscreen b { font: 600 8cqw/1.1 var(--display); letter-spacing: -0.01em; }
.vscreen small { font-size: 4.6cqw; opacity: 0.8; }
.vscreen .shutter { margin-top: 2cqw; }

.vprint .cap { font-weight: 600; letter-spacing: 0.04em; }

/* 02 variety */
.carousel { position: relative; display: grid; place-items: center; }
.carousel > .slot { grid-area: 1 / 1; display: flex; flex-direction: column; align-items: center; gap: 40px; }
.carousel .name { font: 600 30px/1 var(--display); }
.carousel .name span { font: 500 20px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); margin-left: 14px; }
.fine-note { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; font: 500 18px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); }

/* 03 guests */
.guests { display: flex; align-items: flex-end; gap: 56px; }
.tall .guests { gap: 30px; }
.post { width: 100%; }
.post .who { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.post .who i { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #e9c39a, #7a4a3a); }
.post .who b { display: block; font-weight: 600; }
.post .who small { color: #6b7069; font-size: 13px; }
.post .print { position: relative; margin: 6px auto 0; transform: rotate(-2deg); }
.post p { font-size: 17px; line-height: 1.35; margin-top: 14px; }
.post .likes { font-size: 15px; color: #5c615b; margin-top: 8px; font-variant-numeric: tabular-nums; }

/* 04 guest list */
.list { display: flex; align-items: center; gap: 44px; }
.tall .list { gap: 26px; }
.form h3 { margin-top: 4px; }
.form .print { position: relative; align-self: center; transform: rotate(-2deg); flex: none; }
.field { border: 2px solid #d9dcd6; border-radius: 14px; padding: 14px 16px; font: 500 22px/1 var(--mono); letter-spacing: 0.04em; color: #121412; background: #fff; }
.field span { color: #b0b4ad; }
.consent { display: flex; gap: 12px; align-items: flex-start; font-size: 16px; line-height: 1.35; color: #3c403b; }
.box2 { width: 28px; height: 28px; border-radius: 8px; border: 2px solid #8a8f88; flex: none; display: grid; place-items: center; }
.box2.on { background: var(--green); border-color: var(--green); }
.box2.on::after { content: ""; width: 11px; height: 6px; border-left: 3px solid var(--on-green); border-bottom: 3px solid var(--on-green); transform: translateY(-2px) rotate(-45deg); }
.form .send { margin-top: 4px; text-align: center; padding: 16px; border-radius: 999px; font: 600 19px/1 var(--body); color: #f6e7c8; background: #5a1726; }
.stack { display: flex; flex-direction: column; gap: 20px; width: 400px; }
.tall .stack { width: 400px; }
.list > * { flex: none; }
.panel { border-radius: 26px; background: var(--surface-raised); border: 1px solid var(--line); padding: 30px 32px; display: flex; flex-direction: column; gap: 10px; }
.panel .k { font: 500 17px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); }
.panel .big { font: 600 76px/1 var(--display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.panel .sub { font-size: 21px; color: var(--ink-muted); }
.panel .row { display: flex; align-items: center; gap: 12px; font-size: 20px; }
.bubble { align-self: flex-start; max-width: 92%; padding: 16px 20px; border-radius: 20px 20px 20px 6px; background: #2a2d2a; font-size: 20px; line-height: 1.4; color: var(--ink); }

/* 05 service */
.care { display: flex; flex-direction: column; gap: 22px; width: 720px; }
.tall .care { width: 100%; }
.care .panel { gap: 22px; padding: 36px 38px; }
.care .ours { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; }
.care .ours div { display: flex; align-items: center; gap: 14px; font-size: 25px; }
.care .ours .check { width: 32px; height: 32px; }
.care .theirs { font: 600 48px/1.1 var(--display); letter-spacing: -0.02em; }

/* 06 price */
.pricecard { width: 620px; border-radius: 32px; background: var(--surface-raised); border: 1px solid var(--line); padding: 44px 48px; display: flex; flex-direction: column; gap: 26px; box-shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.7); }
.tall .pricecard { width: 760px; }
.pricecard .p { font: 600 120px/0.9 var(--display); letter-spacing: -0.04em; }
.pricecard .p span { font-size: 36px; letter-spacing: 0; color: var(--ink-muted); font-weight: 500; margin-left: 12px; }
.pricecard .u { font-size: 24px; color: var(--ink-muted); }
.pricecard hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
.pricecard .ticks { font-size: 26px; gap: 16px; }
.pricecard .ticks .check { width: 34px; height: 34px; }

/* More venue styles: a cocktail bar with brass lines, a club with neon tubes */
.deco .wing i { width: 13cqw; height: 1.3cqw; border-radius: 1cqw; background: var(--acc); opacity: 0.9; }
.neon .wing i { width: 3.2cqw; height: 11cqw; border-radius: 2cqw; background: var(--acc); box-shadow: 0 0 3cqw var(--acc), 0 0 1cqw #fff inset; }
.neon .wing i:nth-child(even) { background: #3ce8ff; box-shadow: 0 0 3cqw #3ce8ff, 0 0 1cqw #fff inset; }
.neon .topper b { text-shadow: 0 0 3cqw var(--acc); }

/* Hook */
.hook-q { position: absolute; z-index: 2; font: 600 calc(var(--h) * 1.6)/1 var(--display); color: rgba(255, 243, 227, 0.85); opacity: 0; }

/* Mission */
.mission { display: flex; flex-direction: column; align-items: center; gap: 4cqw; padding: 7cqw; text-align: center; }
.mission .k { font: 600 5cqw/1 var(--mono); letter-spacing: 0.2em; color: var(--acc2, #ff4fd8); }
.mission b { font: 600 8.6cqw/1.12 var(--display); }
.stamp { position: absolute; z-index: 4; padding: 0.5em 0.9em; border: 0.18em solid currentColor; border-radius: 0.4em; font: 700 var(--fs, 30px)/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--green); background: rgba(10, 10, 10, 0.55); opacity: 0; white-space: nowrap; }

/* Title */
.titled { position: relative; }
.titled .print { position: relative; }

/* Contest */
.vote { display: flex; flex-direction: column; gap: 12px; }
.vote .row { display: grid; grid-template-columns: 74px 1fr 44px; gap: 12px; align-items: center; }
.vote .row i { aspect-ratio: 1; border-radius: 10px; background: #222 center / cover; position: relative; }
.vote .bar { height: 14px; border-radius: 8px; background: #e6e8e3; overflow: hidden; }
.vote .bar b { display: block; height: 100%; width: 0; background: #c9ccc5; border-radius: 8px; }
.vote .row.win .bar b { background: var(--green); }
.vote .n { font: 600 18px/1 var(--body); text-align: right; font-variant-numeric: tabular-nums; }
.crown { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font: 700 13px/1 var(--mono); background: var(--green); color: var(--on-green); padding: 5px 8px; border-radius: 999px; opacity: 0; white-space: nowrap; }
.toast2 { margin-top: 10px; padding: 14px 16px; border-radius: 16px; background: #121412; color: #fff3e3; font: 600 17px/1.3 var(--body); opacity: 0; }

/* Money */
.ledger { width: 640px; border-radius: 32px; background: var(--surface-raised); border: 1px solid var(--line); padding: 40px 44px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.7); }
.tall .ledger { width: 760px; }
.ledger .l { display: flex; justify-content: space-between; align-items: baseline; font-size: 28px; color: var(--ink-muted); }
.ledger .l b { font: 600 34px/1 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
.ledger .l.you b { color: var(--green); font-size: 44px; }
.ledger hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.ledger .paid { margin-top: 8px; padding: 22px 26px; border-radius: 20px; background: var(--green); color: var(--on-green); font: 600 30px/1.2 var(--display); }
.ledger small { font: 500 16px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); }
</style>
</head>
<body>
<div id="stage">
  <div class="chrome l" id="c-logo"></div>
  <div class="chrome r" id="c-step"></div>
  <div id="scenes"></div>
  <div id="flash"></div>
</div>
<script src="voice/erhverv/timing.js"></script>
<script src="shared.js"></script>
<script>
// ---------- the venues (made up) ----------
const V = {
  kaelder: { name: "Kælderbaren", kind: "Værtshus", sign: "KÆLDERBAREN", sub: "Siden 1962", style: "bulbs",
    casing: "#2a0a12", w1: "#4a1220", w2: "#7a2233", acc: "#e3b04b", ink2: "#f6e7c8", ring: "#ffc65c",
    screen: "#2a0b12", screenInk: "#f6e7c8", frame: "#4a1220", caption: "Kælderbaren · Fredag", photo: "print-bar" },
  nord: { name: "Bar Nord", kind: "Cocktailbar", sign: "BAR NORD", sub: "Cocktails", style: "deco",
    casing: "#0c2a2a", w1: "#103a3a", w2: "#1d5a56", acc: "#d8b46a", ink2: "#e9e1cc", ring: "#7fe3d2",
    screen: "#0c2a2a", screenInk: "#e9e1cc", frame: "#103a3a", caption: "Bar Nord · Lørdag", photo: "print-wedding" },
  neon: { name: "Klub Neon", kind: "Natklub", sign: "KLUB NEON", sub: "Fre · Lør", style: "neon",
    casing: "#0b0614", w1: "#170b2a", w2: "#2a1250", acc: "#ff4fd8", ink2: "#f3e6ff", ring: "#ff6be0",
    screen: "#0b0614", screenInk: "#f3e6ff", frame: "#170b2a", caption: "Klub Neon · Lørdag", photo: "print-club" },
};
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return `rgb(${A.map((x, i) => Math.round(x + (B[i] - x) * k)).join(",")})`; };
const vscreen = (v) => `<div class="vscreen" style="background:${v.screen};color:${v.screenInk}"><span class="sg" style="color:${v.acc}">${v.sign}</span><b>Velkommen til ${v.name}</b><small>Tryk for at tage et billede</small><div class="shutter" style="border-color:${v.screenInk}"><i style="background:${v.acc}"></i></div></div>`;
const vbox = (bw, v, screen, attrs = "") => `
  <div class="vbox ${v.style}" style="--bw:${bw}px;--w1:${v.w1};--w2:${v.w2};--acc:${v.acc};--ink2:${v.ink2};--casing:${v.casing}" ${attrs}>
    <div class="wing l">${"<i></i>".repeat(5)}</div><div class="wing r">${"<i></i>".repeat(5)}</div>
    <div class="topper">${v.style === "bulbs" ? `<span class="row t">${"<i></i>".repeat(9)}</span><span class="row b">${"<i></i>".repeat(9)}</span>` : ""}<b>${v.sign}</b><small>${v.sub}</small></div>
    ${box(bw, screen)}
  </div>`;
const vprint = (w, v, attrs = "") => `<div class="print vprint" style="width:${w}px;--pw:${w}px;background:${v.frame}" ${attrs}><div class="ph" style="background-image:url(${PH}${v.photo}.jpg)"></div><span class="cap" style="color:${v.frameInk || v.acc}">${v.caption}</span></div>`;
function ringColor(b, color, glow) { const r = b.querySelector(".ring"); r.style.stroke = color; r.style.filter = `drop-shadow(0 0 ${glow}px ${color})`; }
function breatheIn(b, t, color) { const k = 0.5 - 0.5 * Math.cos((t / 3.2) * Math.PI * 2); b.querySelector(".ring").style.strokeDasharray = "100 0"; ringColor(b, color, 8 + 14 * k); }

const K = V.kaelder, N = V.neon;
const BW = TALL ? { mission: 320, title: 420, car: 300, phone: 360 } : { mission: 330, title: 430, car: 330, phone: 340 };

const SCENES = [
  {
    id: "hook", dur: 4.6, full: true,
    html: `
      ${bleed("sted-vaertshus", "55% 45%")}
      <div class="copy">
        <span class="pill" data-in="0.05" id="day">Fredag</span>
        <h1 data-in="0.2">Fuld bar.</h1>
        <p class="lede" data-in="2.2"><b>Men på mandag ved I ikke, hvem der var der.</b></p>
      </div>`,
    update(t, el) {
      const k = E.inOut(prog(t, 1.9, 0.6));
      el.querySelector(".bleed img").style.filter = `grayscale(${k}) brightness(${1 - 0.6 * k}) blur(${k * 2}px)`;
      el.querySelector("#day").textContent = t < 2.1 ? "Fredag" : "Mandag";
      el.querySelector("h1").textContent = t < 2.1 ? "Fuld bar." : "Hvem var her?";
    },
  },
  {
    id: "queue", dur: 5.0, full: true,
    sfx: [[0.25, "chime", 0.7]],
    html: `
      ${bleed("klub", "50% 40%")}
      <div class="copy">
        <div data-in="0.1">${logo(TALL ? 60 : 68)}</div>
        <h2 data-in="0.35">Lysringen kan ses over hele dansegulvet.</h2>
        <p class="lede" data-in="2.4"><b>Folk stiller sig i kø af sig selv.</b></p>
      </div>`,
  },
  {
    id: "mission", dur: 4.4,
    sfx: [[3.0, "pop", 0.6]],
    html: `
      <div class="copy">
        <span class="label" data-in="0.1"><span class="n">01</span>Mission</span>
        <h2 data-in="0.2">Tag et billede med en, du ikke kender.</h2>
        <p class="lede" data-in="1.2">Skærmen giver gæsterne små opgaver, og kameraet tjekker, om de klarede dem.</p>
      </div>
      <div class="visual">
        <div style="position:relative" data-in="0">
          ${vbox(BW.mission, N, `<div class="mission" style="background:${N.screen};color:${N.screenInk};width:100%;height:100%;justify-content:center"><span class="k">Mission</span><b>Tag et billede med en, du ikke kender</b></div><img class="shot" src="${PH}sted-gymnasie.jpg" alt="" style="object-position:40% 50%">`)}
          <span class="stamp" style="--fs:${TALL ? 26 : 30}px;left:50%;top:58%">Klaret</span>
        </div>
      </div>`,
    update(t, el) {
      const b = el.querySelector(".box");
      breatheIn(b, t, N.ring);
      b.querySelector(".shot").style.opacity = prog(t, 2.2, 0.4);
      const st = el.querySelector(".stamp"), k = E.out(prog(t, 3.0, 0.35));
      st.style.opacity = k; st.style.transform = `translate(-50%, -50%) rotate(-8deg) scale(${1.6 - 0.6 * k})`;
    },
  },
  {
    id: "title", dur: 4.2,
    sfx: [[1.0, "pop", 0.6]],
    html: `
      <div class="copy">
        <span class="label" data-in="0.1"><span class="n">02</span>Titler</span>
        <h2 data-in="0.2">Aftenens største smil.</h2>
        <p class="lede" data-in="1.6"><b>Det billede vil man have med hjem.</b> Og printet sælger I.</p>
      </div>
      <div class="visual">
        <div class="titled" data-in="0">
          <div style="transform:rotate(-3deg)">${vprint(BW.title, K)}</div>
          <span class="stamp" style="--fs:${TALL ? 24 : 28}px;left:50%;top:42%;color:#ffd166">Aftenens største smil</span>
        </div>
      </div>`,
    update(t, el) {
      const st = el.querySelector(".stamp"), k = E.out(prog(t, 1.0, 0.35));
      st.style.opacity = k; st.style.transform = `translate(-50%, -50%) rotate(-6deg) scale(${1.7 - 0.7 * k})`;
    },
  },
  {
    id: "number", dur: 5.2,
    html: `
      <div class="copy">
        <span class="label" data-in="0.1"><span class="n">03</span>Nummeret</span>
        <h2 data-in="0.2">Billedet på SMS. Nummeret til jer.</h2>
        <p class="lede" data-in="1.4">Gæsten kan sige ja til tilbud fra jer. <b>Samtykket er bygget ind.</b></p>
      </div>
      <div class="visual">
        <div class="list">
          <div class="phone form" style="--phw:${BW.phone}px" data-in="0.1">
            ${vprint(TALL ? 170 : 200, K)}
            <h3>Få billedet på SMS</h3>
            <div class="field"></div>
            <div class="consent"><span class="box2"></span><span>Ja tak til tilbud fra ${K.name}. Kan altid afmeldes.</span></div>
            <div class="send">Send billedet</div>
          </div>
          <div class="stack">
            <div class="panel" data-in="2.6"><span class="k">Gæsteliste</span><span class="big">0</span><span class="sub">har sagt ja til tilbud</span></div>
          </div>
        </div>
      </div>`,
    update(t, el) {
      const digits = "+45 22 41 87 30", typed = Math.floor(clamp((t - 0.6) / 1.2) * digits.length);
      el.querySelector(".field").innerHTML = `${digits.slice(0, typed)}<span>${typed < digits.length ? "|" : ""}</span>`;
      el.querySelector(".box2").classList.toggle("on", t > 2.0);
      el.querySelector(".send").style.opacity = t > 2.0 ? 1 : 0.45;
      el.querySelector(".big").textContent = Math.round(1284 * E.out(prog(t, 2.7, 2.2))).toLocaleString("da-DK");
    },
  },
  {
    id: "contest", dur: 4.8,
    sfx: [[2.6, "cheer", 0.45]],
    html: `
      <div class="copy">
        <span class="label" data-in="0.1"><span class="n">04</span>Konkurrence</span>
        <h2 data-in="0.2">Gæsterne stemmer på aftenens bedste billede.</h2>
        <p class="lede" data-in="2.2"><b>Vinderen henter præmien i baren.</b></p>
      </div>
      <div class="visual">
        <div class="phone" style="--phw:${BW.phone}px" data-in="0">
          <span class="k">${K.name} · I aften</span>
          <h3>Aftenens bedste billede</h3>
          <div class="vote">
            ${[["print-club", 31], ["print-bar", 58], ["print-office", 22]].map(([p, n], i) => `<div class="row${i === 1 ? " win" : ""}" data-n="${n}"><i style="background-image:url(${PH}${p}.jpg)">${i === 1 ? '<span class="crown">Vinder</span>' : ""}</i><span class="bar"><b></b></span><span class="n">0</span></div>`).join("")}
          </div>
          <div class="toast2">Præmien venter i baren.</div>
        </div>
      </div>`,
    update(t, el) {
      const k = E.out(prog(t, 0.5, 1.8));
      el.querySelectorAll(".vote .row").forEach((r) => {
        const n = +r.dataset.n;
        r.querySelector(".bar b").style.width = `${(n / 60) * 100 * k}%`;
        r.querySelector(".n").textContent = Math.round(n * k);
      });
      const c = el.querySelector(".crown"), ck = E.out(prog(t, 2.5, 0.3));
