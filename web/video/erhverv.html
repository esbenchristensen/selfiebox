<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Selfi erhverv</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="venue.css">
<style>
/* The B2B film for the front page (selfi.dk): one film for every kind of venue, from the bar and the
   nightclub to the festival. Written as an ad: the loss first (a full house, and nothing of it on the
   venue's own channels), the box in the venue's own design, then what it does for them: content
   (photos and videos every night), video greetings, missions, titles, a competition, every share
   showing the venue off and a guest list with consent, then the service and one thing to do. No price
   and only the main unit. The venues are made up on purpose, so no real place looks like a customer. */

/* Hook */
.hook-q { position: absolute; z-index: 2; font: 600 calc(var(--h) * 1.6)/1 var(--display); color: rgba(255, 243, 227, 0.85); opacity: 0; }

/* Mission */
.mission { display: flex; flex-direction: column; align-items: center; gap: 4cqw; padding: 7cqw; text-align: center; }
.mission .k { font: 600 5cqw/1 var(--mono); letter-spacing: 0.2em; color: var(--acc2, #ff4fd8); }
.mission b { font: 600 8.6cqw/1.12 var(--display); }
.stamp { position: absolute; z-index: 4; padding: 0.5em 0.9em; border: 0.18em solid currentColor; border-radius: 0.4em; font: 700 var(--fs, 30px)/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--green); background: rgba(10, 10, 10, 0.55); opacity: 0; white-space: nowrap; }

/* Title */
.titled { position: relative; }
.titled .print { position: relative; }

/* Contest */
.vote { display: flex; flex-direction: column; gap: 12px; }
.vote .row { display: grid; grid-template-columns: 74px 1fr 44px; gap: 12px; align-items: center; }
.vote .row i { aspect-ratio: 1; border-radius: 10px; background: #222 center / cover; position: relative; }
.vote .bar { height: 14px; border-radius: 8px; background: #e6e8e3; overflow: hidden; }
.vote .bar b { display: block; height: 100%; width: 0; background: #c9ccc5; border-radius: 8px; }
.vote .row.win .bar b { background: var(--green); }
.vote .n { font: 600 18px/1 var(--body); text-align: right; font-variant-numeric: tabular-nums; }
.crown { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font: 700 13px/1 var(--mono); background: var(--green); color: var(--on-green); padding: 5px 8px; border-radius: 999px; opacity: 0; white-space: nowrap; }
.toast2 { margin-top: 10px; padding: 14px 16px; border-radius: 16px; background: #121412; color: #fff3e3; font: 600 17px/1.3 var(--body); opacity: 0; }


/* Content: tonight's photos and videos fill up, ready for the venue's own channels */
.feed { width: 640px; display: flex; flex-direction: column; gap: 18px; }
.tall .feed { width: 600px; }
.feed .tiles3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.feed .tiles3 i { position: relative; aspect-ratio: 1; border-radius: 14px; background: #222 center / cover; opacity: 0; }
.feed .tiles3 i.vid::after { content: ""; position: absolute; left: 50%; top: 50%; width: 0; height: 0; margin: -14px 0 0 -9px; border-left: 26px solid rgba(255, 255, 255, 0.92); border-top: 15px solid transparent; border-bottom: 15px solid transparent; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5)); }
.feed .tiles3 i.vid::before { content: "VIDEO"; position: absolute; left: 10px; top: 10px; font: 600 12px/1 var(--mono); letter-spacing: 0.12em; padding: 5px 7px; border-radius: 6px; background: rgba(0, 0, 0, 0.6); color: #fff; }
.feed .count { display: flex; justify-content: space-between; align-items: baseline; font: 500 17px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); }
.feed .count b { font: 600 34px/1 var(--display); letter-spacing: -0.02em; color: var(--ink); font-variant-numeric: tabular-nums; text-transform: none; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chips span { padding: 10px 16px; border-radius: 999px; background: var(--surface-raised); border: 1px solid var(--line-strong); font: 500 19px/1 var(--body); color: var(--ink); opacity: 0; }

/* Video on the box screen: a recording dot and a timer */
.rec { position: absolute; z-index: 3; top: 5cqw; left: 5cqw; display: flex; align-items: center; gap: 2cqw; padding: 1.6cqw 3cqw; border-radius: 99px; background: rgba(0, 0, 0, 0.6); color: #fff; font: 600 5cqw/1 var(--mono); letter-spacing: 0.08em; }
.rec i { width: 3.6cqw; height: 3.6cqw; border-radius: 50%; background: #ff3b30; }
.boxscreen-photo { width: 100%; height: 100%; object-fit: cover; }
.q { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4cqw; padding: 8cqw; text-align: center; width: 100%; height: 100%; }
.q .k { font: 600 4.6cqw/1 var(--mono); letter-spacing: 0.2em; }
.q b { font: 600 8.4cqw/1.12 var(--display); }
.greet { display: flex; align-items: center; gap: 48px; }
.tall .greet { gap: 26px; }
.quote { width: 360px; border-radius: 26px; background: var(--surface-raised); border: 1px solid var(--line); padding: 28px 30px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.7); }
.tall .quote { width: 330px; }
.quote .k { font: 500 15px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); }
.quote p { font: 600 30px/1.18 var(--display); letter-spacing: -0.01em; }
.quote small { font-size: 18px; color: var(--ink-muted); }
.quote .wave { display: flex; gap: 5px; align-items: center; height: 36px; }
.quote .wave i { width: 6px; border-radius: 3px; background: var(--green); }
</style>
</head>
<body>
<div id="stage">
  <div class="chrome l" id="c-logo"></div>
  <div class="chrome r" id="c-step"></div>
  <div id="scenes"></div>
  <div id="flash"></div>
</div>
<script src="voice/erhverv/timing.js"></script>
<script src="shared.js"></script>
<script src="venue.js"></script>
<script>
// ---------- the venues (made up) ----------
const V = {
  kaelder: { name: "Kælderbaren", kind: "Værtshus", sign: "KÆLDERBAREN", sub: "Siden 1962", style: "bulbs",
    casing: "#2a0a12", w1: "#4a1220", w2: "#7a2233", acc: "#e3b04b", ink2: "#f6e7c8", ring: "#ffc65c",
    screen: "#2a0b12", screenInk: "#f6e7c8", frame: "#4a1220", caption: "Kælderbaren · Fredag", photo: "print-bar" },
  neon: { name: "Klub Neon", kind: "Natklub", sign: "KLUB NEON", sub: "Fre · Lør", style: "neon",
    casing: "#0b0614", w1: "#170b2a", w2: "#2a1250", acc: "#ff4fd8", ink2: "#f3e6ff", ring: "#ff6be0",
    screen: "#0b0614", screenInk: "#f3e6ff", frame: "#170b2a", caption: "Klub Neon · Lørdag", photo: "print-club" },
  fest: { name: "Skovfest", kind: "Festival", sign: "SKOVFEST", sub: "Lørdag 2027", style: "leaves",
    casing: "#0f2e20", w1: "#123d2a", w2: "#1f5a3c", acc: "#c6f24e", ink2: "#e9f7d0", ring: "#c6f24e",
    screen: "#0f2e20", screenInk: "#e9f7d0", frame: "#123d2a", caption: "Skovfest · Lørdag", photo: "sted-festival" },
  nord: { name: "Bar Nord", kind: "Cocktailbar", sign: "BAR NORD", sub: "Cocktails", style: "deco",
    casing: "#0c2a2a", w1: "#103a3a", w2: "#1d5a56", acc: "#d8b46a", ink2: "#e9e1cc", ring: "#7fe3d2",
    screen: "#0c2a2a", screenInk: "#e9e1cc", frame: "#103a3a", caption: "Bar Nord · Lørdag", photo: "print-wedding" },
};
const K = V.kaelder, N = V.neon, F = V.fest, B = V.nord;
const BW = TALL ? { car: 300, box: 320, title: 420, phone: 360, greet: 300 } : { car: 330, box: 330, title: 430, phone: 340, greet: 320 };
// Tonight's content: photos and a few videos, in the order they pop in.
const FEED = [["print-club", 0], ["print-bar", 1], ["sted-bodega", 0], ["reception", 0], ["sted-festival", 1], ["print-office", 0], ["sted-vaertshus", 0], ["sted-gymnasie", 1], ["sted-hotel", 0]];
const WAVE = [10, 22, 30, 16, 34, 26, 12, 28, 36, 20, 14, 30, 24, 10, 18, 32, 22, 12];

const SCENES = [
  {
    id: "hook", dur: 5.0, full: true,
    html: `
      ${bleed("sted-vaertshus", "55% 45%")}
      <div class="copy">
        <span class="pill" data-in="0.05" id="day">Lørdag aften</span>
        <h1 data-in="0.2">Fyldt med glade gæster.</h1>
        <p class="lede" data-in="2.4"><b>Men på jeres sociale medier ses det ikke.</b></p>
      </div>`,
    update(t, el) {
      const k = E.inOut(prog(t, 2.1, 0.6));
      el.querySelector(".bleed img").style.filter = `grayscale(${k}) brightness(${1 - 0.6 * k}) blur(${k * 2}px)`;
      el.querySelector("#day").textContent = t < 2.3 ? "Lørdag aften" : "Jeres Instagram";
      el.querySelector("h1").textContent = t < 2.3 ? "Fyldt med glade gæster." : "Sidste opslag: for 3 uger siden.";
    },
  },
  {
    id: "intro", dur: 5.4,
    sfx: [[0.25, "chime", 0.7]],
    html: `
      <div class="copy">
        <div data-in="0.05">${logo(TALL ? 60 : 64)}</div>
        <h2 data-in="0.25">En fotoboks i jeres eget design.</h2>
        <p class="lede" data-in="1.6"><b>Og meget mere end en fotoboks.</b> Til barer, klubber, festivaler og alle steder, hvor gæster samles.</p>
      </div>
      <div class="visual">
        <div class="carousel" data-in="0.1">
          ${["kaelder", "neon", "fest"].map((id) => `<div class="slot">${vbox(BW.car, V[id], vscreen(V[id]))}<span class="name">${V[id].name}<span>${V[id].kind}</span></span></div>`).join("")}
        </div>
      </div>`,
    update(t, el) {
      const SW = [1.8, 3.6];
      const i = t < SW[0] ? 0 : t < SW[1] ? 1 : 2;
      let sx = 1;
      for (const s of SW) { const d = Math.abs(t - s); if (d < 0.22) sx = d / 0.22; }
      el.querySelectorAll(".slot").forEach((slot, n) => {
        slot.style.opacity = n === i ? 1 : 0;
        const vb = slot.querySelector(".vbox");
        vb.style.transform = `scaleX(${Math.max(0.02, E.out(sx))})`;
        breatheIn(vb.querySelector(".box"), t, [K, N, F][n].ring);
      });
    },
  },
  {
    id: "content", dur: 7.0,
    html: `
      <div class="copy">
        <span class="label" data-in="0.1"><span class="n">01</span>Contentmaskinen</span>
        <h2 data-in="0.2">Nyt content. Hver eneste aften.</h2>
        <p class="lede" data-in="1.2">Autentiske billeder og videoer af jeres gæster, <b>klar til jeres egne kanaler.</b></p>
      </div>
      <div class="visual">
        <div class="feed" data-in="0">
          <div class="count"><span>I aften · ${N.name}</span><span><b class="np">0</b> fotos · <b class="nv">0</b> videoer</span></div>
          <div class="tiles3">${FEED.map(([p, v]) => `<i class="${v ? "vid" : ""}" style="background-image:url(${PH}${p}.jpg)"></i>`).join("")}</div>
          <div class="chips">${["Instagram", "TikTok", "Facebook", "Nyhedsbrev", "Hjemmesiden", "Skærme"].map((c) => `<span>${c}</span>`).join("")}</div>
        </div>
      </div>`,
    update(t, el) {
      el.querySelectorAll(".tiles3 i").forEach((n, i) => {
        const k = E.out(prog(t, 0.4 + i * 0.32, 0.4));
        n.style.opacity = k; n.style.transform = `scale(${0.85 + 0.15 * k})`;
      });
      el.querySelector(".np").textContent = Math.round(214 * E.out(prog(t, 0.4, 3.4)));
      el.querySelector(".nv").textContent = Math.round(38 * E.out(prog(t, 0.6, 3.4)));
      el.querySelectorAll(".chips span").forEach((n, i) => {
        const k = E.out(prog(t, 3.9 + i * 0.22, 0.4));
        n.style.opacity = k; n.style.transform = `translateY(${(1 - k) * 12}px)`;
      });
    },
  },
  {
    id: "video", dur: 4.8,
    html: `
      <div class="copy">
        <span class="label" data-in="0.1"><span class="n">02</span>Video</span>
        <h2 data-in="0.2">Skål, dans og grin. På video.</h2>
        <p class="lede" data-in="1.2">Gæsterne optager korte videoer, <b>der er lavet til at blive delt.</b></p>
      </div>
      <div class="visual">
        <div data-in="0">
          ${vbox(BW.box, N, `<img class="boxscreen-photo" src="${PH}print-club.jpg" alt="" style="object-position:50% 40%"><span class="rec"><i></i><span class="tm">0:00</span></span>`)}
        </div>
      </div>`,
    update(t, el) {
      breatheIn(el.querySelector(".box"), t, N.ring);
      const s = Math.min(8, Math.floor(clamp((t - 0.4) / 4.2) * 9));
      el.querySelector(".tm").textContent = `0:0${s}`;
      el.querySelector(".rec i").style.opacity = Math.floor(t * 2) % 2 ? 0.25 : 1;
      el.querySelector(".boxscreen-photo").style.transform = `scale(${1.05 + 0.1 * (t / 4.8)})`;
    },
  },
  {
    id: "greeting", dur: 6.0,
    sfx: [[3.2, "pop", 0.55]],
    html: `
      <div class="copy">
        <span class="label" data-in="0.1"><span class="n">03</span>Videohilsner</span>
        <h2 data-in="0.2">Gæsternes egne ord.</h2>
        <p class="lede" data-in="1.2">De svarer på et spørgsmål, I har valgt. <b>Så får I ægte udtalelser.</b></p>
      </div>
      <div class="visual">
        <div class="greet">
          <div data-in="0">
            ${vbox(BW.greet, B, `<div class="q" style="background:${B.screen};color:${B.screenInk}"><span class="k" style="color:${B.acc}">Videohilsen</span><b>Hvad er det bedste ved i aften?</b></div><img class="boxscreen-photo shot" src="${PH}sted-bodega.jpg" alt="" style="position:absolute;inset:0;opacity:0"><span class="rec" style="opacity:0"><i></i>REC</span>`)}
          </div>
          <div class="quote" data-in="3.0">
            <span class="k">Videohilsen · ${B.name}</span>
            <div class="wave">${WAVE.map((h) => `<i style="height:${h}px"></i>`).join("")}</div>
            <p>“Bedste cocktails i byen, og personalet er bare søde!”</p>
            <small>Sofie, 24 · Lørdag</small>
          </div>
        </div>
      </div>`,
    update(t, el) {
      breatheIn(el.querySelector(".box"), t, B.ring);
      const k = prog(t, 1.6, 0.4);
      el.querySelector(".shot").style.opacity = k;
      el.querySelector(".rec").style.opacity = k * (Math.floor(t * 2) % 2 ? 0.5 : 1);
      el.querySelectorAll(".wave i").forEach((w, i) => (w.style.transform = `scaleY(${0.45 + 0.55 * Math.abs(Math.sin(t * 5 + i * 0.9))})`));
    },
  },
  {
    id: "mission", dur: 4.4,
    sfx: [[3.0, "pop", 0.6]],
    html: `
      <div class="copy">
        <span class="label" data-in="0.1"><span class="n">04</span>Missioner</span>
        <h2 data-in="0.2">Tag et billede med en, du ikke kender.</h2>
        <p class="lede" data-in="1.2">Skærmen giver gæsterne små opgaver, og kameraet tjekker, om de klarede dem.</p>
      </div>
      <div class="visual">
        <div style="position:relative" data-in="0">
          ${vbox(BW.box, N, `<div class="mission" style="background:${N.screen};color:${N.screenInk};width:100%;height:100%;justify-content:center"><span class="k">Mission</span><b>Tag et billede med en, du ikke kender</b></div><img class="shot" src="${PH}sted-gymnasie.jpg" alt="" style="object-position:40% 50%">`)}
          <span class="stamp" style="--fs:${TALL ? 26 : 30}px;left:50%;top:58%">Klaret</span>
        </div>
      </div>`,
    update(t, el) {
      const b = el.querySelector(".box");
      breatheIn(b, t, N.ring);
      b.querySelector(".shot").style.opacity = prog(t, 2.2, 0.4);
      const st = el.querySelector(".stamp"), k = E.out(prog(t, 3.0, 0.35));
      st.style.opacity = k; st.style.transform = `translate(-50%, -50%) rotate(-8deg) scale(${1.6 - 0.6 * k})`;
    },
  },
  {
    id: "title", dur: 4.6,
    sfx: [[1.0, "pop", 0.6]],
    html: `
      <div class="copy">
        <span class="label" data-in="0.1"><span class="n">05</span>Titler</span>
        <h2 data-in="0.2">Aftenens største smil.</h2>
        <p class="lede" data-in="1.6">Boksen kårer titlen og stempler den på billedet. <b>Det billede vil man have med hjem.</b></p>
      </div>
      <div class="visual">
        <div class="titled" data-in="0">
          <div style="transform:rotate(-3deg)">${vprint(BW.title, K)}</div>
          <span class="stamp" style="--fs:${TALL ? 24 : 28}px;left:50%;top:42%;color:#ffd166">Aftenens største smil</span>
        </div>
      </div>`,
    update(t, el) {
      const st = el.querySelector(".stamp"), k = E.out(prog(t, 1.0, 0.35));
      st.style.opacity = k; st.style.transform = `translate(-50%, -50%) rotate(-6deg) scale(${1.7 - 0.7 * k})`;
    },
  },
  {
    id: "contest", dur: 4.8,
    sfx: [[2.6, "cheer", 0.45]],
    html: `
      <div class="copy">
        <span class="label" data-in="0.1"><span class="n">06</span>Konkurrence</span>
        <h2 data-in="0.2">Gæsterne stemmer på aftenens bedste billede.</h2>
        <p class="lede" data-in="2.2"><b>Vinderen henter præmien i baren.</b></p>
      </div>
      <div class="visual">
        <div class="phone" style="--phw:${BW.phone}px" data-in="0">
          <span class="k">${K.name} · I aften</span>
          <h3>Aftenens bedste billede</h3>
          <div class="vote">
            ${[["print-club", 31], ["print-bar", 58], ["print-office", 22]].map(([p, n], i) => `<div class="row${i === 1 ? " win" : ""}" data-n="${n}"><i style="background-image:url(${PH}${p}.jpg)">${i === 1 ? '<span class="crown">Vinder</span>' : ""}</i><span class="bar"><b></b></span><span class="n">0</span></div>`).join("")}
          </div>
          <div class="toast2">Præmien venter i baren.</div>
        </div>
      </div>`,
    update(t, el) {
      const k = E.out(prog(t, 0.5, 1.8));
      el.querySelectorAll(".vote .row").forEach((r) => {
        const n = +r.dataset.n;
        r.querySelector(".bar b").style.width = `${(n / 60) * 100 * k}%`;
        r.querySelector(".n").textContent = Math.round(n * k);
      });
      const c = el.querySelector(".crown"), ck = E.out(prog(t, 2.5, 0.3));
      c.style.opacity = ck; c.style.transform = `translateX(-50%) scale(${1.4 - 0.4 * ck})`;
      const to = el.querySelector(".toast2"), tk = E.out(prog(t, 2.9, 0.4));
      to.style.opacity = tk; to.style.transform = `translateY(${(1 - tk) * 14}px)`;
    },
  },
  {
    id: "reach", dur: 5.2,
    sfx: [[1.6, "pop", 0.5]],
    html: `
      <div class="copy">
        <span class="label" data-in="0.1"><span class="n">07</span>Logo og deling</span>
        <h2 data-in="0.2">Hver deling viser jer frem.</h2>
        <p class="lede" data-in="1.2">Jeres navn står på hvert foto. <b>Når gæsterne deler, ser alle deres venner, hvor de var.</b></p>
      </div>
      <div class="visual">
        <div class="phone" style="--phw:${BW.phone}px" data-in="0">
          <div class="post">
            <div class="who"><i></i><span><b>sofie.holm</b><small>${F.name}</small></span></div>
            ${vprint(BW.phone - 70, F)}
            <p>Bedste festival i år</p>
            <div class="likes"><span class="n">0</span> synes godt om · <span class="m">0</span> delinger</div>
          </div>
        </div>
      </div>`,
    update(t, el) {
      el.querySelector(".likes .n").textContent = Math.round(214 * E.out(prog(t, 1.4, 2.6)));
      el.querySelector(".likes .m").textContent = Math.round(37 * E.out(prog(t, 1.8, 2.6)));
    },
  },
  {
    id: "number", dur: 5.2,
    html: `
      <div class="copy">
        <span class="label" data-in="0.1"><span class="n">08</span>Gæsteliste</span>
        <h2 data-in="0.2">Billedet på SMS. Nummeret til jer.</h2>
        <p class="lede" data-in="1.4">Gæsten kan sige ja til tilbud fra jer. <b>Samtykket er bygget ind.</b></p>
      </div>
      <div class="visual">
        <div class="list">
          <div class="phone form" style="--phw:${BW.phone}px" data-in="0.1">
            ${vprint(TALL ? 170 : 200, K)}
            <h3>Få billedet på SMS</h3>
            <div class="field"></div>
            <div class="consent"><span class="box2"></span><span>Ja tak til tilbud fra ${K.name}. Kan altid afmeldes.</span></div>
            <div class="send">Send billedet</div>
          </div>
          <div class="stack">
            <div class="panel" data-in="2.6"><span class="k">Gæsteliste</span><span class="big">0</span><span class="sub">har sagt ja til tilbud</span></div>
          </div>
        </div>
      </div>`,
    update(t, el) {
      const digits = "+45 22 41 87 30", typed = Math.floor(clamp((t - 0.6) / 1.2) * digits.length);
      el.querySelector(".field").innerHTML = `${digits.slice(0, typed)}<span>${typed < digits.length ? "|" : ""}</span>`;
      el.querySelector(".box2").classList.toggle("on", t > 2.0);
      el.querySelector(".send").style.opacity = t > 2.0 ? 1 : 0.45;
