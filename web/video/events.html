<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Selfi events</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="venue.css">
<style>
/* The film for big venues: festivals, theme parks, zoos and arenas. Written as an ad: the loss first
   (thousands of photos a day, and none of them shows where they were taken), then the box in their
   own universe, the reach every shared photo gives, the multi-box games that move guests around the
   site (treasure hunt, stamp trail), competitions, sponsors, a guest list, seasons, the service and
   one thing to do. The venues are made up on purpose, so no real park or festival looks like a customer. */

/* Treasure hunt: a map with boxes along a trail */
.map { position: relative; width: 760px; aspect-ratio: 760 / 540; border-radius: 30px; background: radial-gradient(120% 90% at 30% 20%, #1c3a28, #0f2018); border: 1px solid var(--line); overflow: hidden; box-shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.7); }
.tall .map { width: 860px; }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map .trail { fill: none; stroke: rgba(255, 243, 227, 0.35); stroke-width: 5; stroke-dasharray: 2 14; stroke-linecap: round; }
.map .done { fill: none; stroke: var(--green); stroke-width: 6; stroke-linecap: round; }
.map .area { fill: rgba(255, 255, 255, 0.04); }
.pin { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.pin i { width: 46px; height: 60px; border-radius: 12px; background: #0a0a0a; box-shadow: inset 0 0 0 5px rgba(255, 243, 227, 0.35); }
.pin.on i { box-shadow: inset 0 0 0 5px #ffd23f, 0 0 26px #ffd23f; }
.pin span { font: 600 17px/1 var(--body); color: var(--ink); background: rgba(0, 0, 0, 0.55); padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
.token { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 6px rgba(34, 211, 107, 0.25); }
.treasure { position: absolute; right: 26px; bottom: 24px; }

/* Stamp trail */
.scard { width: 100%; display: flex; flex-direction: column; gap: 14px; }
.stamps { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.stamps div { aspect-ratio: 1; border-radius: 18px; border: 2px dashed #c9ccc5; display: grid; place-items: center; text-align: center; font: 600 15px/1.2 var(--body); color: #8a8f88; position: relative; }
.stamps div b { position: absolute; inset: 10px; border-radius: 50%; display: grid; place-items: center; background: var(--acc, #6a2bb0); color: #fff; font: 700 15px/1.1 var(--display); transform: rotate(-10deg); opacity: 0; }
.reward { padding: 14px 16px; border-radius: 16px; background: #121412; color: #fff3e3; font: 600 17px/1.3 var(--body); opacity: 0; }

/* Season switch: one box, three screens */
.season-names { display: flex; gap: 12px; margin-top: 34px; justify-content: center; }
.season-names span { padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line-strong); font: 500 18px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); }
.season-names span.on { background: var(--ink); color: #121412; border-color: var(--ink); }

/* Stamps on screens and prints (same as in erhverv.html) */
.stamp { position: absolute; z-index: 4; padding: 0.5em 0.9em; border: 0.18em solid currentColor; border-radius: 0.4em; font: 700 var(--fs, 30px)/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--green); background: rgba(10, 10, 10, 0.55); opacity: 0; white-space: nowrap; }

/* Sponsor frame */
.sponsor { margin-top: 10px; display: flex; align-items: center; gap: 10px; justify-content: center; font: 600 15px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: #fff; opacity: 0.95; }
.sponsor i { width: 26px; height: 26px; border-radius: 50%; background: #e2001a; }
.frame-big { position: relative; display: flex; flex-direction: column; align-items: center; }
.frame-big .print { position: relative; }
.frame-big .sponsor.in { position: absolute; top: 1.2%; left: 0; right: 0; margin: 0; font-size: 13px; color: #e9f7d0; }
.frame-big .sponsor.in i { width: 16px; height: 16px; }
</style>
</head>
<body>
<div id="stage">
  <div class="chrome l" id="c-logo"></div>
  <div class="chrome r" id="c-step"></div>
  <div id="scenes"></div>
  <div id="flash"></div>
</div>
<script src="voice/events/timing.js"></script>
<script src="shared.js"></script>
<script src="venue.js"></script>
<script>
// ---------- the venues (made up) ----------
const V = {
  park: { name: "Eventyrparken", kind: "Forlystelsespark", sign: "EVENTYRPARKEN", sub: "Sæson 2027", style: "bulbs",
    casing: "#2a0f45", w1: "#3b1466", w2: "#6a2bb0", acc: "#ffd23f", ink2: "#fff3d6", ring: "#ffd23f",
    screen: "#2a0f45", screenInk: "#fff3d6", frame: "#3b1466", caption: "Eventyrparken · Juli", photo: "print-birthday" },
  fest: { name: "Skovfest", kind: "Festival", sign: "SKOVFEST", sub: "Lørdag 2027", style: "leaves",
    casing: "#0f2e20", w1: "#123d2a", w2: "#1f5a3c", acc: "#c6f24e", ink2: "#e9f7d0", ring: "#c6f24e",
    screen: "#0f2e20", screenInk: "#e9f7d0", frame: "#123d2a", caption: "Skovfest · Lørdag", photo: "print-club" },
  zoo: { name: "Zoo Nord", kind: "Zoo", sign: "ZOO NORD", sub: "Dyr og natur", style: "leaves",
    casing: "#1d1408", w1: "#3a2410", w2: "#7a4a1a", acc: "#f2a541", ink2: "#fff1d6", ring: "#f2a541",
    screen: "#1d1408", screenInk: "#fff1d6", frame: "#3a2410", caption: "Zoo Nord · Påske", photo: "print-wedding" },
};
const P = V.park;
// The same park in two seasons, for the season scene: only the screen and the frame change.
const SEASONS = [
  { label: "Sommer", screen: P.screen, ink: P.screenInk, acc: P.acc, title: "Velkommen til Eventyrparken" },
  { label: "Halloween", screen: "#160b02", ink: "#ffe3c4", acc: "#ff7a1a", title: "Gys i Eventyrparken" },
  { label: "Jul", screen: "#0d2416", ink: "#fff1e6", acc: "#e8433f", title: "Jul i Eventyrparken" },
];
const seasonScreen = (s) => `<div class="vscreen" style="background:${s.screen};color:${s.ink}"><span class="sg" style="color:${s.acc}">EVENTYRPARKEN</span><b>${s.title}</b><small>Tryk for at tage et billede</small><div class="shutter" style="border-color:${s.ink}"><i style="background:${s.acc}"></i></div></div>`;

const BW = TALL ? { morph: 290, car: 300, season: 300, phone: 360, frame: 420 } : { morph: 320, car: 330, season: 320, phone: 340, frame: 440 };

// The treasure-hunt trail, in map coordinates (760 × 540).
const TRAIL = "M70 470 C 160 380, 120 300, 230 260 S 420 300, 440 200 S 560 80, 690 110";
const PINS = [["Indgangen", 0.0], ["Søen", 0.34], ["Scenen", 0.64], ["Butikken", 1.0]];

const SCENES = [
  {
    id: "hook", dur: 4.8, full: true,
    html: `
      ${bleed("sted-festival", "55% 50%")}
      <div class="copy">
        <span class="pill" data-in="0.05">Hver dag</span>
        <h1 data-in="0.2">Tusindvis af billeder.</h1>
        <p class="lede" data-in="2.0"><b>Og de fleste viser kun et ansigt. Ikke hvor de var.</b></p>
      </div>`,
  },
  {
    id: "theme", dur: 7.0,
    sfx: [[0.2, "chime", 0.7]],
    html: `
      <div class="copy">
        <div data-in="0.05">${logo(TALL ? 60 : 64)}</div>
        <h2 data-in="0.25">En del af jeres univers.</h2>
        <div class="ticks">
          ${tick("Boksen i jeres figurer og farver", 1.4)}
          ${tick("Skærmen byder velkommen", 2.8)}
          ${tick("Jeres navn på hvert foto", 4.2)}
        </div>
      </div>
      <div class="visual">
        <div style="position:relative;padding-bottom:${Math.round(BW.morph * 0.55)}px" data-in="0">
          ${vprint(Math.round(BW.morph * 0.6), P, 'id="m-print"')}
          ${vbox(BW.morph, P, `${idle}<div class="v">${vscreen(P)}</div>`)}
        </div>
      </div>`,
    update(t, el) {
      const vb = el.querySelector(".vbox"), b = vb.querySelector(".box");
      const rk = E.inOut(prog(t, 1.4, 0.8));
      b.querySelector(".ring").style.strokeDasharray = "100 0";
      ringColor(b, mix("#fff3e3", P.ring, rk), 8 + 14 * (0.5 - 0.5 * Math.cos((t / 3.2) * Math.PI * 2)));
      const wk = E.out(prog(t, 1.4, 0.9));
      vb.querySelector(".wing.l").style.transform = `translateX(${(1 - wk) * 70}%)`;
      vb.querySelector(".wing.r").style.transform = `translateX(${-(1 - wk) * 70}%)`;
      vb.querySelectorAll(".wing").forEach((w) => (w.style.opacity = wk));
      const tk = E.out(prog(t, 1.7, 0.8)), top = vb.querySelector(".topper");
      top.style.opacity = tk; top.style.transform = `translateY(${(1 - tk) * 40}%)`;
      vb.style.setProperty("--casing", mix("#0a0a0a", P.casing, wk));
      const sk = prog(t, 2.8, 0.5), v = b.querySelector(".v");
      b.querySelector(".idle").style.opacity = 1 - sk; v.style.opacity = sk; v.style.width = v.style.height = "100%";
      const pr = el.querySelector("#m-print"), pk = E.inOut(prog(t, 4.2, 1.2));
      pr.style.left = `calc(50% - ${pr.offsetWidth / 2}px)`;
      pr.style.top = `${vb.offsetTop + b.offsetHeight - pr.offsetHeight - 30}px`;
      pr.style.transform = `translateY(${pk * pr.offsetHeight * 0.9}px) rotate(${-3 * pk}deg)`;
      pr.style.opacity = pk > 0 ? 1 : 0;
    },
  },
  {
    id: "variety", dur: 4.2,
    html: `
      <div class="copy">
        <span class="label" data-in="0.1">Designet til jer</span>
        <h2 data-in="0.2">Forlystelsespark, festival eller zoo.</h2>
        <p class="lede" data-in="1.0">Vi designer temaet sammen med jer og <b>printer delene selv</b>.</p>
      </div>
      <div class="visual">
        <div class="carousel" data-in="0.1">
          ${["park", "fest", "zoo"].map((id) => `<div class="slot">${vbox(BW.car, V[id], vscreen(V[id]))}<span class="name">${V[id].name}<span>${V[id].kind}</span></span></div>`).join("")}
        </div>
        <span class="fine-note" data-in="0.8">Eksempler på designs</span>
      </div>`,
    update(t, el) {
      const SW = [1.4, 2.8];
      const i = t < SW[0] ? 0 : t < SW[1] ? 1 : 2;
      let sx = 1;
      for (const s of SW) { const d = Math.abs(t - s); if (d < 0.22) sx = d / 0.22; }
      el.querySelectorAll(".slot").forEach((slot, n) => {
        slot.style.opacity = n === i ? 1 : 0;
        const vb = slot.querySelector(".vbox");
        vb.style.transform = `scaleX(${Math.max(0.02, E.out(sx))})`;
        breatheIn(vb.querySelector(".box"), t, Object.values(V)[n].ring);
      });
    },
  },
  {
    id: "reach", dur: 5.2,
    sfx: [[1.6, "pop", 0.5]],
    html: `
      <div class="copy">
        <span class="label" data-in="0.1">Omtale</span>
        <h2 data-in="0.2">Hver deling viser jer frem.</h2>
        <p class="lede" data-in="1.2">Jeres navn og univers står på hvert foto. <b>Når gæsterne deler, ser alle deres venner, hvor de var.</b></p>
      </div>
      <div class="visual">
        <div class="phone" style="--phw:${BW.phone}px" data-in="0">
          <div class="post">
            <div class="who"><i></i><span><b>familien.berg</b><small>Eventyrparken</small></span></div>
            ${vprint(BW.phone - 70, P)}
            <p>Bedste dag i år</p>
            <div class="likes"><span class="n">0</span> synes godt om · <span class="m">0</span> delinger</div>
          </div>
        </div>
      </div>`,
    update(t, el) {
      el.querySelector(".likes .n").textContent = Math.round(214 * E.out(prog(t, 1.4, 2.6)));
      el.querySelector(".likes .m").textContent = Math.round(37 * E.out(prog(t, 1.8, 2.6)));
    },
  },
  {
    id: "hunt", dur: 6.0,
    sfx: [[1.1, "pop", 0.45], [2.4, "pop", 0.45], [3.6, "pop", 0.45], [4.6, "cheer", 0.5]],
    html: `
      <div class="copy">
        <span class="label" data-in="0.1">Skattejagt</span>
        <h2 data-in="0.2">Med flere bokse bliver området til en skattejagt.</h2>
        <p class="lede" data-in="1.2">Gæsterne følger spor fra boks til boks, <b>forbi de steder, I gerne vil vise frem</b>.</p>
      </div>
      <div class="visual">
        <div class="map" data-in="0">
          <svg viewBox="0 0 760 540" preserveAspectRatio="none">
            <ellipse class="area" cx="300" cy="300" rx="120" ry="70"/><ellipse class="area" cx="600" cy="150" rx="110" ry="60"/>
            <path class="trail" d="${TRAIL}"/><path class="done" d="${TRAIL}"/>
          </svg>
          ${PINS.map(([n], i) => `<div class="pin" data-i="${i}"><i></i><span>${i + 1} · ${n}</span></div>`).join("")}
          <div class="token"></div>
          <span class="pill green treasure" style="opacity:0">Skatten fundet</span>
        </div>
      </div>`,
    update(t, el) {
      const map = el.querySelector(".map"), svg = map.querySelector("svg"), path = svg.querySelector(".done");
      const L = path.getTotalLength(), k = E.inOut(prog(t, 0.6, 4.0));
      path.style.strokeDasharray = `${L * k} ${L}`;
      const sx = map.clientWidth / 760, sy = map.clientHeight / 540;
      const pt = path.getPointAtLength(L * k), tok = map.querySelector(".token");
      tok.style.left = `${pt.x * sx}px`; tok.style.top = `${pt.y * sy}px`;
      map.querySelectorAll(".pin").forEach((p) => {
        const f = PINS[+p.dataset.i][1], q = path.getPointAtLength(L * f);
        p.style.left = `${q.x * sx}px`; p.style.top = `${q.y * sy - 10}px`;
        p.classList.toggle("on", k >= f - 0.001 && t > 0.6);
      });
      const tr = map.querySelector(".treasure"), tk = E.out(prog(t, 4.6, 0.4));
      tr.style.opacity = tk; tr.style.transform = `scale(${1.3 - 0.3 * tk})`;
    },
  },
  {
    id: "trail", dur: 5.2,
    sfx: [[0.9, "pop", 0.45], [1.5, "pop", 0.45], [2.1, "pop", 0.45], [2.7, "pop", 0.45], [3.3, "chime", 0.5]],
    html: `
      <div class="copy">
        <span class="label" data-in="0.1">Rundtur</span>
        <h2 data-in="0.2">Et stempel ved hver boks.</h2>
        <p class="lede" data-in="1.2">Den, der når hele vejen rundt, vinder. <b>Præmien kan hentes i jeres butik.</b></p>
      </div>
      <div class="visual">
        <div class="phone" style="--phw:${BW.phone}px;--acc:${P.w2}" data-in="0">
          <div class="scard">
            <span class="k">${P.name} · Rundtur</span>
            <h3>Saml alle fire</h3>
            <div class="stamps">${["Indgangen", "Søen", "Scenen", "Butikken"].map((n) => `<div>${n}<b>${n}</b></div>`).join("")}</div>
            <div class="reward">Alle fire stempler. Hent præmien i butikken.</div>
          </div>
        </div>
      </div>`,
    update(t, el) {
      el.querySelectorAll(".stamps b").forEach((b, i) => {
        const k = E.out(prog(t, 0.9 + i * 0.6, 0.25));
        b.style.opacity = k; b.style.transform = `rotate(-10deg) scale(${1.5 - 0.5 * k})`;
      });
      const r = el.querySelector(".reward"), rk = E.out(prog(t, 3.3, 0.4));
      r.style.opacity = rk; r.style.transform = `translateY(${(1 - rk) * 12}px)`;
    },
  },
  {
    id: "sponsor", dur: 4.6,
    html: `
      <div class="copy">
        <span class="label" data-in="0.1">Konkurrencer og sponsorer</span>
        <h2 data-in="0.2">Plads til en sponsor i rammen.</h2>
        <p class="lede" data-in="1.0">Titler og konkurrencer holder gang i dagen, og <b>sponsoren følger med på hvert eneste foto</b>.</p>
      </div>
      <div class="visual">
        <div class="frame-big" data-in="0">
          <div style="transform:rotate(-3deg);position:relative">${vprint(BW.frame, V.fest)}<div class="sponsor in" data-in="1.6"><i></i>Præsenteret af jeres sponsor</div></div>
          <span class="stamp" style="--fs:${TALL ? 24 : 28}px;left:50%;top:40%;color:#c6f24e">Dagens bedste billede</span>
        </div>
      </div>`,
    update(t, el) {
      const st = el.querySelector(".stamp"), k = E.out(prog(t, 0.9, 0.35));
      st.style.opacity = k; st.style.transform = `translate(-50%, -50%) rotate(-6deg) scale(${1.7 - 0.7 * k})`;
    },
  },
  {
    id: "list", dur: 4.6,
    html: `
      <div class="copy">
        <span class="label" data-in="0.1">Gæstelisten</span>
        <h2 data-in="0.2">Inviter dem igen næste sæson.</h2>
        <p class="lede" data-in="1.0">Gæsterne kan sige ja til nyheder fra jer, når de får billedet. <b>Samtykket er bygget ind.</b></p>
      </div>
      <div class="visual">
        <div class="stack">
          <div class="panel" data-in="0.2"><span class="k">Gæsteliste · ${P.name}</span><span class="big">0</span><span class="sub">har sagt ja til nyheder</span></div>
          <div class="panel" data-in="1.6"><span class="k">Nyhedsbrev</span><div class="bubble">Sæsonstart 1. april. Som tak for sidst får I en fast-track-billet med i år.</div></div>
        </div>
      </div>`,
    update(t, el) { el.querySelector(".big").textContent = Math.round(18432 * E.out(prog(t, 0.3, 2.6))).toLocaleString("da-DK"); },
  },
  {
    id: "seasons", dur: 4.6,
    html: `
      <div class="copy">
        <span class="label" data-in="0.1">Hele året</span>
        <h2 data-in="0.2">Nyt tema til Halloween og jul.</h2>
        <p class="lede" data-in="1.0">Skærmen og rammen skifter i kontrolpanelet. <b>Samme boks, ny sæson.</b></p>
      </div>
      <div class="visual">
        <div style="display:flex;flex-direction:column;align-items:center">
          <div style="position:relative">
            ${SEASONS.map((s, i) => `<div class="ss" data-i="${i}" style="${i ? "position:absolute;inset:0;" : ""}">${vbox(BW.season, P, seasonScreen(s))}</div>`).join("")}
          </div>
          <div class="season-names">${SEASONS.map((s) => `<span>${s.label}</span>`).join("")}</div>
        </div>
      </div>`,
    update(t, el) {
      const i = t < 1.4 ? 0 : t < 2.9 ? 1 : 2;
      el.querySelectorAll(".ss").forEach((s, n) => {
        s.style.opacity = n === i ? 1 : 0;
        breatheIn(s.querySelector(".box"), t, SEASONS[n].acc);
      });
      el.querySelectorAll(".season-names span").forEach((s, n) => s.classList.toggle("on", n === i));
    },
  },
  {
    id: "care", dur: 5.0,
    html: `
      <div class="copy">
        <span class="label" data-in="0.1">Fuld service</span>
        <h2 data-in="0.2">Vi sørger for resten.</h2>
        <p class="lede" data-in="1.0">Fra én boks ved indgangen til en hel rute på festivalpladsen.</p>
      </div>
      <div class="visual">
        <div class="care">
          <div class="panel" data-in="0.3">
            <span class="k">Det klarer vi</span>
            <div class="ours">
              ${[["Design og print af temaet", 0.6], ["Montering og test", 0.9], ["Overvågning af alle bokse", 1.2], ["Ny boks ved fejl", 1.5]].map(([x, a]) => tick(x, a)).join("")}
            </div>
          </div>
          <div class="panel" data-in="2.8">
            <span class="k">Det klarer I</span>
            <span class="theirs">Tager imod gæsterne.</span>
          </div>
        </div>
      </div>`,
  },
  {
    id: "cta", dur: 4.0, center: true, last: true, hold: 1.2,
    sfx: [[0.15, "shutter", 0.8], [0.3, "chime", 0.8]],
    html: `
      <div data-in="0.05">${logo(TALL ? 96 : 110)}</div>
      <h2 data-in="0.3" style="margin-top:48px">Se boksen i jeres tema</h2>
      <span class="btn" data-in="0.6" style="margin-top:48px">Book en snak på selfi.dk</span>
      <p class="fine" data-in="0.9" style="margin-top:28px">Tema · Omtale · Skattejagt og rundtur · Sponsorer · Fuld service</p>`,
  },
];

mountFilm(SCENES, { steps: 0, plain: ["cta", "theme"] });
</script>
</body>
</html>
