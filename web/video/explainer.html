<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Selfi explainer</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Selfi explainer film. Rendered frame by frame by render.cjs: every frame is set by seek(t),
   so nothing in here may use CSS transitions or animations. Same tokens as app/globals.css. */
:root {
  --surface: #0e0f0e; --surface-raised: #171917; --surface-sunk: #090a09;
  --line: #2a2d2a; --line-strong: #5d625c; --ink: #fff3e3; --ink-muted: #a3a8a2;
  --green: #22d36b; --on-green: #0b1a10; --halo: #fff3e3;
  --display: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --body: "Geist", "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
}
/* 16:9 for desktop */
.wide { --W: 1920px; --H: 1080px; --pad: 128px; --top: 0px; --h: 92px; --lede: 34px; --label: 22px; --gap: 96px; }
/* 4:5 for phones: everything a bit larger, because it is shown at a third of its size */
.tall { --W: 1080px; --H: 1350px; --pad: 84px; --top: 150px; --h: 78px; --lede: 37px; --label: 25px; --gap: 44px; }

* { box-sizing: border-box; margin: 0; }
html, body { background: var(--surface); overflow: hidden; }
body { width: var(--W); height: var(--H); color: var(--ink); font-family: var(--body); -webkit-font-smoothing: antialiased; }
#stage { position: relative; width: var(--W); height: var(--H); overflow: hidden; background: var(--surface); }
#stage::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 70% at 72% 52%, rgba(255, 243, 227, 0.07), transparent 70%); }
.tall #stage::before { background: radial-gradient(80% 50% at 50% 72%, rgba(255, 243, 227, 0.07), transparent 70%); }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 50; pointer-events: none; }

/* Chrome that stays between scenes */
.chrome { position: absolute; z-index: 40; top: 56px; display: flex; align-items: center; gap: 14px; }
.chrome.l { left: var(--pad); }
.chrome.r { right: var(--pad); font: 500 var(--label)/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); }
.chrome.r b { color: var(--ink); font-weight: 500; }
.dots { display: flex; gap: 8px; margin-left: 10px; }
.dots i { width: 28px; height: 4px; border-radius: 4px; background: var(--line-strong); }
.dots i.on { background: var(--green); }

/* Logo, same drawing as components/Logo.tsx */
.logo { display: inline-flex; align-items: center; gap: 0.32em; font-size: var(--ls, 34px); line-height: 1; color: var(--ink); }
.logo svg { height: 1.12em; width: auto; }
.logo .ring, .logo .smile { fill: none; stroke: var(--green); stroke-width: 12; }
.logo .lens { fill: var(--green); }
.logo .word { font-family: var(--display); font-weight: 500; letter-spacing: -0.045em; font-feature-settings: "liga" 0; position: relative; top: -0.04em; }
.logo .i { position: relative; display: inline-block; }
.logo .i::after { content: ""; position: absolute; left: 50%; top: 0.12em; width: 0.17em; height: 0.17em; margin-left: -0.085em; border-radius: 50%; background: var(--green); }

/* Scene layout: copy and visual side by side (wide) or stacked (tall) */
.scene { position: absolute; inset: 0; display: grid; opacity: 0; padding: 0 var(--pad); }
.wide .scene { grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr); column-gap: var(--gap); align-items: center; }
.tall .scene { grid-template-rows: auto minmax(0, 1fr); row-gap: var(--gap); padding-top: var(--top); padding-bottom: 80px; }
.scene.center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.copy { display: flex; flex-direction: column; gap: 28px; align-items: flex-start; }
.visual { position: relative; display: grid; place-items: center; min-height: 0; }
.wide .visual { height: 860px; }
.tall .visual { height: 100%; }

.label { font: 500 var(--label)/1.2 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); display: flex; gap: 16px; align-items: center; }
.label .n { color: var(--green); }
h1, h2 { font-family: var(--display); font-weight: 600; font-size: var(--h); line-height: 1; letter-spacing: -0.035em; text-wrap: balance; }
.lede { font-size: var(--lede); line-height: 1.42; color: var(--ink-muted); max-width: 31ch; text-wrap: pretty; }
.lede b { color: var(--ink); font-weight: 500; }
.tall .lede { max-width: 34ch; }

/* The box, drawn like the CSS box in Story.tsx, as SVG so the ring can count down */
.box { position: relative; width: var(--bw, 400px); aspect-ratio: 234 / 306; container-type: inline-size; flex: none; }
.box > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.box .shell { fill: #0a0a0a; }
.box .ring, .box .ring-base { fill: none; stroke-width: 9; stroke-linecap: round; }
.box .ring { stroke: var(--halo); filter: drop-shadow(0 0 7px rgba(255, 243, 227, 0.55)); }
.box .ring-base { stroke: rgba(255, 243, 227, 0.14); }
.box .notch { fill: #0a0a0a; }
.box .cam { fill: #222; stroke: #333; stroke-width: 2; }
.box .screen { position: absolute; left: 16.24%; top: 12.42%; width: 67.52%; height: 75.16%; border-radius: 4.3cqw; background: #050505; overflow: hidden; color: var(--ink); display: grid; place-items: center; text-align: center; }
.box .screen > * { grid-area: 1 / 1; }
.box .screen img { width: 100%; height: 100%; object-fit: cover; }
.box .idle b { display: block; font: 600 7.4cqw/1.15 var(--display); letter-spacing: -0.01em; padding: 0 8cqw; }
.box .shutter { width: 18cqw; height: 18cqw; border-radius: 50%; border: 0.7cqw solid var(--halo); display: grid; place-items: center; margin: 6cqw auto 0; }
.box .shutter i { width: 12.6cqw; height: 12.6cqw; border-radius: 50%; background: var(--green); }
.box .count { font: 600 40cqw/1 var(--display); letter-spacing: -0.05em; }
.shadow { box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6); border-radius: 15.4cqw; }

.tap { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; border: 3px solid rgba(255, 243, 227, 0.9); background: rgba(255, 243, 227, 0.18); opacity: 0; z-index: 30; pointer-events: none; }

/* Instax print */
.print { position: absolute; background: #fbfaf6; padding: 5% 5% 19%; box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5); color: #121412; }
.print .ph { aspect-ratio: 1; background: #222 center / cover; }
.print .cap { position: absolute; left: 0; right: 0; bottom: 5.5%; text-align: center; font: 500 calc(var(--pw) * 0.062)/1 var(--body); color: #3c403b; }

/* 01 calendar */
.card { width: 680px; border-radius: 30px; background: var(--surface-raised); border: 1px solid var(--line); box-shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.7); padding: 32px; display: flex; flex-direction: column; gap: 22px; position: relative; }
.tall .card { width: 760px; }
.pkgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pkg { display: flex; flex-direction: column; gap: 4px; padding: 14px 18px; border-radius: 20px; border: 1px solid var(--line-strong); }
.pkg b { font: 600 24px/1.2 var(--display); }
.pkg span { font-size: 18px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.pkg.on { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
.cal-title { font: 600 24px/1 var(--display); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 6px; }
.dow { font: 400 15px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); text-align: center; padding-bottom: 12px; }
.day { height: 54px; display: grid; place-items: center; font-size: 20px; font-variant-numeric: tabular-nums; position: relative; }
.day span { width: 50px; height: 50px; display: grid; place-items: center; border-radius: 50%; position: relative; z-index: 1; }
.day .bg { position: absolute; inset: 0; background: rgba(34, 211, 107, 0.16); opacity: 0; }
.day.booked { color: var(--ink-muted); opacity: 0.5; }
.day.booked span { text-decoration: line-through; }
.day.past { color: var(--ink-muted); opacity: 0.35; }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 20px; border-top: 1px solid var(--line); padding-top: 22px; }
.foot .sum { display: grid; font-size: 19px; color: var(--ink-muted); }
.foot .sum > * { grid-area: 1 / 1; }
.foot .sum b { display: block; font: 500 24px/1.25 var(--display); color: var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; font: 500 22px/1.2 var(--body); padding: 18px 32px; border-radius: 999px; background: var(--green); color: var(--on-green); white-space: nowrap; }
.toast { position: absolute; left: 50%; bottom: -36px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; white-space: nowrap; padding: 18px 28px; border-radius: 999px; background: var(--ink); color: #121412; font: 500 22px/1 var(--body); opacity: 0; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); }
.check { width: 30px; height: 30px; border-radius: 50%; background: var(--green); display: grid; place-items: center; flex: none; }
.check::after { content: ""; width: 12px; height: 7px; border-left: 3px solid var(--on-green); border-bottom: 3px solid var(--on-green); transform: translateY(-2px) rotate(-45deg); }

/* 02 delivery */
.deliver { display: flex; align-items: center; gap: 64px; }
.tall .deliver { gap: 44px; }
.standbox { position: relative; display: flex; flex-direction: column; align-items: center; }
.pole { width: 14px; height: var(--pole, 300px); background: linear-gradient(90deg, #1b1d1b, #3a3d3a 50%, #1b1d1b); margin-top: -4px; }
.base { width: 190px; height: 16px; border-radius: 50%; background: #222522; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); margin-top: -4px; }
.cable { position: absolute; left: 50%; bottom: 6px; overflow: visible; }
.cable path { fill: none; stroke: #3a3d3a; stroke-width: 5; stroke-linecap: round; }
.socket { position: absolute; width: 58px; height: 58px; border-radius: 14px; background: #f3f4f1; display: grid; place-items: center; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4); }
.socket::before { content: ""; width: 34px; height: 34px; border-radius: 50%; background: #dfe1dc; box-shadow: inset 0 0 0 2px #c9ccc5; }
.socket i { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #555; top: 26px; }
.opts { display: flex; flex-direction: column; gap: 18px; width: 520px; }
.tall .opts { width: 470px; }
.opt { display: flex; gap: 20px; align-items: flex-start; padding: 26px 28px; border-radius: 24px; background: var(--surface-raised); border: 1px solid var(--line); }
.opt .k { font: 500 18px/1.4 var(--mono); color: var(--green); }
.opt b { display: block; font: 600 28px/1.15 var(--display); margin-bottom: 8px; }
.opt span { font-size: 21px; line-height: 1.4; color: var(--ink-muted); }
.tall .opt b { font-size: 27px; }
.tall .opt span { font-size: 21px; }

/* 03 take a photo */
.bloom { position: absolute; width: 95%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 250, 240, 0.16), rgba(255, 243, 227, 0.05) 55%, transparent); opacity: 0; }
.smile { position: absolute; inset: auto 0 6cqw; font: 600 8cqw/1 var(--display); text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6); }

/* 04 take it home */
.home { position: relative; display: flex; align-items: flex-start; gap: 0; }
.qr { display: flex; flex-direction: column; align-items: center; gap: 5cqw; padding: 6cqw; }
.qr b { font: 600 6.4cqw/1.15 var(--display); }
.qr small { font-size: 4.6cqw; color: var(--ink-muted); }
.qr .code { width: 40cqw; height: 40cqw; background: #fff; padding: 2.4cqw; border-radius: 2cqw; display: grid; grid-template-columns: repeat(21, 1fr); }
.qr .code i { background: #121412; }
.qr .code i.o { background: transparent; }
.phone { position: relative; width: var(--phw, 320px); aspect-ratio: 9 / 18; border-radius: 44px; background: #fbfaf6; border: 9px solid #111; color: #121412; padding: 26px 18px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.55); overflow: hidden; }
.phone .k { font: 500 13px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: #6b7069; }
.phone h3 { font: 600 28px/1.05 var(--display); letter-spacing: -0.02em; margin-top: 6px; }
.phone .meta { font-size: 15px; color: #5c615b; font-variant-numeric: tabular-nums; margin-top: 4px; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.grid i { aspect-ratio: 1; background: #222 center / cover; border-radius: 6px; }

/* Themes */
.themes { display: flex; gap: 36px; align-items: flex-end; }
.tall .themes { gap: 26px; }
.theme { display: flex; flex-direction: column; align-items: center; gap: 26px; }
.theme .label { color: var(--ink); }

/* Price */
.ticks { display: flex; flex-direction: column; gap: 18px; font-size: var(--lede); color: var(--ink); }
.ticks div { display: flex; align-items: center; gap: 18px; }
.ticks .check { width: 38px; height: 38px; }
.tiles { display: flex; flex-direction: column; gap: 20px; width: 620px; }
.tall .tiles { flex-direction: row; width: 100%; gap: 16px; }
.tile { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; padding: 34px 36px; border-radius: 28px; background: var(--surface-raised); border: 1px solid var(--line); }
.tall .tile { flex: 1; flex-direction: column; align-items: flex-start; gap: 18px; padding: 30px 28px; }
.tile b { font: 600 34px/1 var(--display); }
.tile small { display: block; font-size: 21px; color: var(--ink-muted); margin-top: 10px; }
.tile .p { font: 600 54px/1 var(--display); letter-spacing: -0.03em; white-space: nowrap; }
.tile .p span { font-size: 26px; color: var(--ink-muted); font-weight: 500; letter-spacing: 0; margin-left: 6px; }
.tall .tile .p { font-size: 48px; }
.tile.on { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }

/* Outro */
.center h2 { max-width: 15ch; }
.center .fine { font-size: calc(var(--lede) * 0.8); color: var(--ink-muted); max-width: 40ch; text-wrap: balance; }
.center .btn { font-size: 30px; padding: 26px 48px; }
</style>
</head>
<body>
<div id="stage">
  <div class="chrome l" id="c-logo"></div>
  <div class="chrome r" id="c-step"><span>Sådan virker den</span><span class="dots"><i></i><i></i><i></i><i></i></span></div>
  <div id="scenes"></div>
  <div id="flash"></div>
</div>
<script>
const FORMAT = new URLSearchParams(location.search).get("format") === "tall" ? "tall" : "wide";
document.documentElement.className = FORMAT;
const TALL = FORMAT === "tall";
const PH = "../public/photos/";
const MD = "../public/models/";

// ---------- building blocks ----------
const RING = "M117 18.5 H196 A19.5 19.5 0 0 1 215.5 38 V268 A19.5 19.5 0 0 1 196 287.5 H38 A19.5 19.5 0 0 1 18.5 268 V38 A19.5 19.5 0 0 1 38 18.5 H117";
const logo = (size) => `<span class="logo" style="--ls:${size}px"><svg viewBox="0 0 92 120"><path class="ring" d="M58 12 H60 A20 20 0 0 1 80 32 V88 A20 20 0 0 1 60 108 H32 A20 20 0 0 1 12 88 V32 A20 20 0 0 1 32 12 H34"/><circle class="lens" cx="46" cy="12" r="7"/><path class="smile" d="M31 66 A17 17 0 0 0 61 66"/></svg><span class="word">self<span class="i">ı</span></span></span>`;
const box = (bw, screen, attrs = "", cls = "") => `<div class="box ${cls}" style="--bw:${bw}px" ${attrs}><svg viewBox="0 0 234 306"><rect class="shell" width="234" height="306" rx="36"/><path class="ring-base" d="${RING}"/><path class="ring" d="${RING}" pathLength="100"/><rect class="notch" x="92" y="8" width="50" height="26" rx="10"/><circle class="cam" cx="117" cy="20" r="5"/></svg><div class="screen">${screen}</div></div>`;
const idle = `<div class="idle"><b>Tryk for at tage et billede</b><div class="shutter"><i></i></div></div>`;
const print = (w, img, cap, attrs = "") => `<div class="print" style="width:${w}px;--pw:${w}px" ${attrs}><div class="ph" style="background-image:url(${PH}${img}.jpg)"></div><span class="cap">${cap}</span></div>`;
const tick = (t, at) => `<div data-in="${at}"><span class="check"></span>${t}</div>`;
const label = (n, t) => `<span class="label" data-in="0.2">${n ? `<span class="n">${n}</span>` : ""}${t}</span>`;

// A QR-looking pattern: three finder squares and fixed noise, so every frame is the same.
function qr() {
  let s = 7, out = "";
  const rnd = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
  const finder = (x, y, ox, oy) => { const dx = x - ox, dy = y - oy; if (dx < 0 || dy < 0 || dx > 6 || dy > 6) return null; return dx === 0 || dy === 0 || dx === 6 || dy === 6 || (dx > 1 && dx < 5 && dy > 1 && dy < 5); };
  for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) {
    let f = finder(x, y, 0, 0); if (f === null) f = finder(x, y, 14, 0); if (f === null) f = finder(x, y, 0, 14);
    const near = (x < 8 && y < 8) || (x > 12 && y < 8) || (x < 8 && y > 12);
    const on = f !== null ? f : near ? false : rnd() > 0.5;
    out += `<i${on ? "" : ' class="o"'}></i>`;
  }
  return `<div class="code">${out}</div>`;
}

// June 2027: the 1st is a Tuesday. The weekend picked is Fri 11 – Sun 13.
function calendar() {
  const dows = ["man", "tir", "ons", "tor", "fre", "lør", "søn"].map((d) => `<span class="dow">${d}</span>`).join("");
  let days = "<span></span>";
  for (let d = 1; d <= 30; d++) {
    const cls = [5, 19, 20, 26].includes(d) ? "booked" : d < 3 ? "past" : "";
    days += `<div class="day ${cls}" data-d="${d}"><i class="bg"></i><span>${d}</span></div>`;
  }
  return `<div class="cal">${dows}${days}</div>`;
}

// ---------- scenes ----------
const BW = TALL
  ? { intro: 400, s3: 370, s4: 300, s2: 250, theme: 262 }
  : { intro: 470, s3: 440, s4: 360, s2: 300, theme: 270 };

const SCENES = [
  {
    id: "intro", dur: 5.5,
    html: `
      <div class="copy">
        <div data-in="0.3">${logo(TALL ? 60 : 64)}</div>
        <span class="label" data-in="0.9">Fotoboks til leje</span>
        <h1 data-in="1.2">Lej en fotoboks, der får alle med på billedet.</h1>
      </div>
      <div class="visual">${box(BW.intro, idle, 'data-in="0.1" id="intro-box"')}</div>`,
    update(t, el) { breathe(el.querySelector(".box"), t); },
  },
  {
    id: "why", dur: 6.2,
    html: `
      <div class="copy">
        <span class="label" data-in="0.2">Til bryllup, fødselsdag og firmafest</span>
        <h2 data-in="0.4">Det bedste billede fra festen er det, hvor alle er med.</h2>
      </div>
      <div class="visual" id="why-v">
        ${print(TALL ? 300 : 360, "print-wedding", "Skål for brudeparret", 'data-drop="0.5" data-r="-7" data-x="-0.36" data-y="0.02"')}
        ${print(TALL ? 300 : 360, "print-birthday", "Tillykke, mor", 'data-drop="1.1" data-r="4" data-x="0.02" data-y="-0.05"')}
        ${print(TALL ? 300 : 360, "print-office", "Julefrokost 2026", 'data-drop="1.7" data-r="-2" data-x="0.36" data-y="0.06"')}
      </div>`,
    update(t, el) {
      const v = el.querySelector(".visual"), W = v.clientWidth, H = v.clientHeight;
      el.querySelectorAll(".print").forEach((p) => {
        const k = E.out(prog(t, +p.dataset.drop, 0.9));
        const x = +p.dataset.x * W * (TALL ? 0.95 : 0.92), y = +p.dataset.y * H, r = +p.dataset.r;
        const drift = Math.sin(t * 0.6 + r) * 4;
        p.style.left = `calc(50% - ${p.offsetWidth / 2}px)`; p.style.top = `calc(50% - ${p.offsetHeight / 2}px)`;
        p.style.opacity = k;
        p.style.transform = `translate(${x}px, ${y + (1 - k) * -140 + drift}px) rotate(${r + (1 - k) * 14}deg) scale(${1.15 - 0.15 * k})`;
      });
    },
  },
  {
    id: "s1", dur: 7.6, step: 1,
    html: `
      <div class="copy">
        ${label("01", "Vælg jeres dage")}
        <h2 data-in="0.4">Vælg dagene i kalenderen.</h2>
        <p class="lede" data-in="0.8"><b>En dag 495 kr., en weekend 750 kr. og en uge 1.250 kr.</b> Altid inkl. moms. Vi bekræfter på mail.</p>
      </div>
      <div class="visual">
        <div class="card" data-in="0.3">
          <div class="pkgs">
            <div class="pkg" data-p="dag"><b>Dag</b><span>495 kr.</span></div>
            <div class="pkg" data-p="weekend"><b>Weekend</b><span>750 kr.</span></div>
            <div class="pkg" data-p="uge"><b>Uge</b><span>1.250 kr.</span></div>
          </div>
          <span class="cal-title">Juni 2027</span>
          ${calendar()}
          <div class="foot">
            <div class="sum"><span class="a">Vælg første dag</span><span class="b"><b>Fre 11. – søn 13. juni</b>750 kr. inkl. moms</span></div>
            <span class="btn">Send forespørgsel</span>
          </div>
          <div class="toast"><span class="check"></span>Sendt. Vi bekræfter på mail.</div>
          <div class="tap"></div>
        </div>
      </div>`,
    update(t, el) {
      const card = el.querySelector(".card");
      const wk = el.querySelector('[data-p="weekend"]');
      wk.classList.toggle("on", t > 1.75);
      const range = [11, 12, 13];
      range.forEach((d, i) => {
        const day = el.querySelector(`[data-d="${d}"]`), on = prog(t, 2.75 + i * 0.16, 0.25);

// ---------- timeline ----------
const E = { out: (x) => 1 - Math.pow(1 - x, 3), inOut: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2) };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, d) => clamp((t - a) / d);
const FADE = 0.45;

let start = 0;
for (const s of SCENES) { s.start = start; start += s.dur; }
const DURATION = start;

const root = document.getElementById("scenes");
for (const s of SCENES) {
  const el = document.createElement("section");
  el.className = `scene${s.center ? " center" : ""}`;
  el.innerHTML = s.html;
  root.appendChild(el);
  s.el = el;
}
document.getElementById("c-logo").innerHTML = logo(TALL ? 38 : 34);

function breathe(b, t) {
  const r = b.querySelector(".ring"), k = 0.5 - 0.5 * Math.cos((t / 3.2) * Math.PI * 2);
  r.style.strokeDasharray = "100 0";
  r.style.filter = `drop-shadow(0 0 ${7 + 16 * k}px rgba(255,243,227,${0.5 + 0.25 * k}))`;
}

// A touch: the ring lands on the target, swells and fades.
function tapAt(tap, frame, t, taps) {
  tap.style.opacity = 0;
  for (const [at, target] of taps) {
    const k = (t - at) / 0.55;
    if (k < 0 || k > 1) continue;
    const f = frame.getBoundingClientRect(), r = target.getBoundingClientRect();
    tap.style.left = `${r.left - f.left + r.width / 2}px`;
    tap.style.top = `${r.top - f.top + r.height / 2}px`;
    tap.style.opacity = k < 0.25 ? k / 0.25 : 1 - (k - 0.25) / 0.75;
    tap.style.transform = `scale(${0.6 + 0.9 * E.out(k)})`;
  }
}

let flashT = null;
function flashAt(t, at) { flashT = t >= at && t < at + 0.45 ? 1 - (t - at) / 0.45 : 0; }

function seek(t) {
  flashT = 0;
  const steps = document.getElementById("c-step"), logoEl = document.getElementById("c-logo");
  let step = 0, chromeLogo = 0, stepVis = 0;
  for (const s of SCENES) {
    const lt = t - s.start;
    const active = lt >= -0.01 && lt < s.dur + 0.01;
    s.el.style.display = active ? "" : "none";
    if (!active) continue;
    const fin = prog(lt, 0, FADE), fout = s.last ? 0 : prog(lt, s.dur - FADE, FADE);
    s.el.style.opacity = fin * (1 - fout);
    s.el.style.transform = `translateY(${-14 * E.inOut(fout)}px)`;
    s.el.querySelectorAll("[data-in]").forEach((n) => {
      const k = E.out(prog(lt, +n.dataset.in, 0.7));
      n.style.opacity = k;
      n.style.translate = `0 ${(1 - k) * 28}px`;
    });
    if (s.update) s.update(lt, s.el);
    if (s.step) { step = s.step; stepVis = s.el.style.opacity; }
    if (!["intro", "cta"].includes(s.id)) chromeLogo = s.el.style.opacity;
  }
  logoEl.style.opacity = chromeLogo;
  steps.style.opacity = stepVis;
  steps.querySelectorAll(".dots i").forEach((d, i) => d.classList.toggle("on", i < step));
  document.getElementById("flash").style.opacity = (flashT || 0) * 0.4;
}

window.DURATION = DURATION;
window.seek = seek;
window.ready = Promise.all([
  document.fonts.ready,
  ...[...document.images].map((i) => i.decode().catch(() => {})),
  ...[...new Set([...document.querySelectorAll("[style*=background-image]")].map((n) => n.style.backgroundImage.slice(5, -2)))].map((src) => new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = src; })),
]).then(() => seek(+(new URLSearchParams(location.search).get("t") || 0)));

// Preview in a browser: ?play plays in real time.
if (new URLSearchParams(location.search).has("play")) window.ready.then(() => { const t0 = performance.now(); const f = () => { seek(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(f); }; f(); });
</script>
