<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Selfi privat</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="shared.css">
<style>
/* The film for renting a box for one party (selfi.dk). Written as an ad:
   a problem in the first seconds, the brand right after, one peak (3-2-1, flash, laughter),
   the payoff, the one worry answered, the price made small, and one thing to do. */

/* Hook: a phone full of party photos where nobody is all in */
.gallery { width: var(--phw); aspect-ratio: 9 / 18; border-radius: 46px; border: 10px solid #111; background: #0b0b0b; overflow: hidden; position: relative; box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6); }
.gallery .roll { position: absolute; left: 6px; right: 6px; top: 50px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.gallery .roll i { aspect-ratio: 1; background: #222 center / 280% no-repeat; }
.gallery .bar { position: absolute; top: 0; left: 0; right: 0; height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font: 600 15px/1 var(--body); color: #fff; background: #0b0b0b; z-index: 2; }
.gallery .bar span { color: var(--ink-muted); font-weight: 500; }
.nope { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3; white-space: nowrap; }

/* Peak: the box counts down, then the photo */
.peak-shot { position: absolute; inset: 0; opacity: 0; }
.click { position: absolute; left: var(--pad); bottom: 110px; z-index: 3; font: 600 calc(var(--h) * 1.3)/1 var(--display); letter-spacing: -0.04em; color: #fff; text-shadow: 0 6px 40px rgba(0, 0, 0, 0.5); }
.tall .click { bottom: 130px; }

/* Price: the weekend price, then what it is per guest */
.big-price { font: 600 calc(var(--h) * 2.1)/0.9 var(--display); letter-spacing: -0.05em; }
.big-price span { font-size: 0.32em; letter-spacing: 0; color: var(--ink-muted); margin-left: 0.2em; }
.math { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; font: 500 calc(var(--lede) * 1.05)/1.2 var(--body); color: var(--ink-muted); }
.math b { color: var(--ink); font-weight: 600; }
.math .eq { padding: 12px 22px; border-radius: 999px; background: var(--green); color: var(--on-green); font-weight: 600; }
.pricebox { display: flex; flex-direction: column; gap: 30px; align-items: flex-start; }
</style>
</head>
<body>
<div id="stage">
  <div class="chrome l" id="c-logo"></div>
  <div class="chrome r" id="c-step"></div>
  <div id="scenes"></div>
  <div id="flash"></div>
</div>
<script src="voice/explainer/timing.js"></script>
<script src="shared.js"></script>
<script>
const BW = TALL ? { peak: 470, home: 290, theme: 262, phone: 390 } : { peak: 500, home: 340, theme: 270, phone: 360 };

// Close crops of real party photos: half faces, a shoulder, a blurred arm. Nobody is all in.
const CROPS = [
  ["print-wedding", "10% 20%"], ["sted-gymnasie", "85% 30%"], ["print-office", "95% 10%"], ["print-birthday", "0% 60%"],
  ["sted-julefrokost", "70% 20%", 1], ["print-club", "100% 40%"], ["sted-bryllup", "20% 60%"], ["print-bar", "90% 30%", 1],
  ["reception", "80% 40%"], ["print-wedding", "100% 80%"], ["sted-gymnasie", "10% 70%", 1], ["print-office", "0% 30%"],
  ["print-birthday", "100% 20%"], ["sted-bodega", "60% 60%", 1], ["print-club", "0% 90%"], ["sted-vaertshus", "30% 40%"],
  ["print-bar", "0% 70%"], ["sted-julefrokost", "10% 50%"], ["print-wedding", "50% 0%", 1], ["sted-festival", "70% 60%"],
  ["print-birthday", "50% 100%"], ["print-office", "60% 90%"], ["sted-gymnasie", "50% 10%"], ["print-club", "60% 0%", 1],
];

const SCENES = [
  {
    id: "hook", dur: 4.4,
    html: `
      <div class="copy">
        <h1 data-in="0.15">100 billeder fra festen.</h1>
        <p class="lede" data-in="1.6"><b>Og ikke ét, hvor alle er med.</b></p>
      </div>
      <div class="visual">
        <div class="gallery" style="--phw:${BW.phone}px" data-in="0">
          <div class="bar">Seneste<span>100 billeder</span></div>
          <div class="roll">${CROPS.map(([p, pos, blur]) => `<i style="background-image:url(${PH}${p}.jpg);background-position:${pos}${blur ? ";filter:blur(3px)" : ""}"></i>`).join("")}</div>
          <span class="pill nope" style="opacity:0">Ingen med alle</span>
        </div>
      </div>`,
    update(t, el) {
      el.querySelector(".roll").style.transform = `translateY(${-E.out(prog(t, 0, 2.2)) * BW.phone * 0.9}px)`;
      const n = el.querySelector(".nope"), k = E.out(prog(t, 2.3, 0.4));
      n.style.opacity = k; n.style.transform = `translate(-50%, -50%) scale(${1.25 - 0.25 * k}) rotate(-4deg)`;
    },
  },
  {
    id: "solve", dur: 3.6, full: true,
    sfx: [[0.25, "chime", 0.7]],
    html: `
      ${bleed("sted-gymnasie", "40% 45%")}
      <div class="copy">
        <div data-in="0.1">${logo(TALL ? 64 : 72)}</div>
        <h2 data-in="0.35">Samler alle foran kameraet.</h2>
      </div>`,
  },
  {
    id: "peak", dur: 4.2, center: true, hold: 1.3,
    // The numbers land on the words: Jonas says "tre", "to", "én" about 0.6, 1.4 and 2.2 s into the scene.
    sfx: [[0.55, "beep", 0.55], [1.4, "beep", 0.55], [2.2, "beep", 0.55], [2.95, "shutter", 1], [3.1, "cheer", 0.6]],
    html: `
      <div class="bloom" style="opacity:.6"></div>
      ${box(BW.peak, `<span class="count"></span>`, "", "shadow")}
      <div class="peak-shot">${bleed("print-birthday", "50% 35%")}<span class="click">Klik.</span></div>`,
    update(t, el) {
      const b = el.querySelector(".box"), ring = b.querySelector(".ring"), base = b.querySelector(".ring-base"), count = b.querySelector(".count");
      const MARKS = [0.55, 1.4, 2.2], SNAP = 2.95, T0 = MARKS[0];
      if (t < T0) { breathe(b, t); base.style.opacity = 0; count.style.opacity = 0; }
      else if (t < SNAP) {
        const i = MARKS.filter((m) => t >= m).length - 1;
        count.textContent = 3 - i; count.style.opacity = 1;
        count.style.transform = `scale(${1.3 - 0.3 * E.out(prog(t, MARKS[i], 0.25))})`;
        base.style.opacity = 1; ring.style.strokeDasharray = `${(1 - (t - T0) / (SNAP - T0)) * 100} 100`;
        ring.style.filter = "drop-shadow(0 0 10px rgba(255,243,227,.7))";
      } else {
        count.style.opacity = 0; base.style.opacity = 0; ring.style.strokeDasharray = "100 0";
        ring.style.stroke = "#fff"; ring.style.filter = "drop-shadow(0 0 50px rgba(255,255,255,.95))";
      }
      flashAt(t, SNAP);
      const shot = el.querySelector(".peak-shot"), k = prog(t, SNAP + 0.05, 0.2);
      shot.style.opacity = k;
      shot.querySelector("img").style.transform = `scale(${1.15 - 0.1 * E.out(prog(t, SNAP, 1.5))})`;
      const c2 = shot.querySelector(".click"), ck = E.out(prog(t, SNAP + 0.3, 0.4));
      c2.style.opacity = ck; c2.style.transform = `translateY(${(1 - ck) * 30}px)`;
    },
  },
  {
    id: "home", dur: 4.6,
    sfx: [[1.0, "pop", 0.5]],
    html: `
      <div class="copy">
        <h2 data-in="0.15">På telefonen med det samme.</h2>
        <p class="lede" data-in="1.6">Og dagen efter har I <b>alle billeder</b> på jeres egen eventside.</p>
      </div>
      <div class="visual">
        <div class="phone" style="--phw:${BW.phone}px" data-in="0">
          <span class="k">Jeres eventside</span>
          <div><h3>Sofie og Mads</h3><div class="meta">12. juni 2027 · <span class="n">0</span> billeder</div></div>
          <div class="grid">
            ${["print-birthday", "print-wedding", "sted-gymnasie", "print-office", "sted-bryllup", "print-club"].map((p) => `<i style="background-image:url(${PH}${p}.jpg)"></i>`).join("")}
          </div>
        </div>
      </div>`,
    update(t, el) {
      el.querySelectorAll(".grid i").forEach((g, i) => {
        const gk = E.out(prog(t, (i === 0 ? 0.9 : 1.8 + i * 0.25), 0.35));
        g.style.opacity = gk; g.style.transform = `scale(${0.8 + 0.2 * gk})`;
      });
      el.querySelector(".meta .n").textContent = Math.round(148 * E.out(prog(t, 1.8, 2.4)));
    },
  },
  {
    id: "easy", dur: 3.2, full: true,
    html: `
      ${bleed("sted-bryllup", "60% 45%")}
      <div class="copy">
        <span class="pill" data-in="0.1">Ingen skal stå ved den</span>
        <h2 data-in="0.3">Den står på en stander og passer sig selv.</h2>
      </div>`,
  },
  {
    id: "themes", dur: 3.6,
    html: `
      <div class="copy">
        <span class="label" data-in="0.1">Temaer</span>
        <h2 data-in="0.2">Bryllup, fødselsdag eller julefrokost.</h2>
      </div>
      <div class="visual">
        <div class="themes">
          ${[["bryllup", "Bryllup"], ["fodselsdag", "Fødselsdag"], ["julefrokost", "Julefrokost"]].map(([id, name], i) => `
            <div class="theme" data-in="${0.3 + i * 0.35}">
              ${box(BW.theme, `<img src="${MD}${id}/screen.png" alt="">`, "", "shadow")}
              <span class="label">${name}</span>
            </div>`).join("")}
        </div>
      </div>`,
    update(t, el) {
      el.querySelectorAll(".theme").forEach((th, i) => (th.querySelector(".box").style.transform = `translateY(${(i === 1 ? -40 : 0) + Math.sin(t * 1.4 + i * 1.7) * 6}px)`));
    },
  },
  {
    id: "price", dur: 6.0,
    html: `
      <div class="copy">
        <span class="label" data-in="0.1">En hel weekend</span>
        <div class="big-price" data-in="0.2">750<span>kr.</span></div>
        <span class="muted" data-in="0.5" style="font-size:calc(var(--lede)*.8)">Inkl. moms · ubegrænsede billeder · eventside</span>
      </div>
      <div class="visual">
        <div class="pricebox">
          <div class="math" data-in="2.6"><span><b>750 kr.</b></span><span>÷</span><span><b>75 gæster</b></span><span>=</span><span class="eq">10 kr. pr. gæst</span></div>
        </div>
      </div>`,
  },
  {
    id: "cta", dur: 4.0, center: true, last: true, hold: 1.2,
    sfx: [[0.15, "shutter", 0.8], [0.3, "chime", 0.8]],
    html: `
      <div data-in="0.05">${logo(TALL ? 96 : 110)}</div>
      <h2 data-in="0.3" style="margin-top:48px">Tjek jeres dato på selfi.dk</h2>
      <span class="btn" data-in="0.6" style="margin-top:48px">Se ledige datoer</span>
      <p class="fine" data-in="0.9" style="margin-top:28px">Fra 495 kr. inkl. moms · Ubegrænsede billeder · Eventside med alle fotos</p>`,
  },
];

mountFilm(SCENES, { steps: 0, plain: ["cta", "solve"] });
</script>
</body>
</html>
