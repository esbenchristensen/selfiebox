<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="907" viewBox="0 0 1030 907" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="1030" height="907" fill="#fff"/><text x="30" y="34" font-size="26" font-weight="800">halo-gen2-slim2 · Pi-ben</text><text x="30" y="74" font-size="21" font-weight="700">Raspberry Pi 5: GPIO-stikket, ben for ben</text><text x="30" y="98" font-size="14" fill="#444">Som på dit billede: Pi'en med USB-portene opad og GPIO-stikket i venstre side.</text><text x="30" y="117" font-size="14" fill="#444">Kun 5 ben bruges. Ben 1 og 2 er nederst, i enden længst væk fra USB. Lige ben yderst mod kanten.</text><text x="512" y="144" font-size="14" text-anchor="middle" fill="#444">↑ USB-portene</text><rect x="474" y="156" width="64" height="608" rx="6" fill="#222"/><rect x="510" y="736.0" width="18" height="18" fill="#d6336c" stroke="#fff" stroke-width="1.5"/><text x="544" y="750.0" font-size="15" font-weight="800" fill="#111">1</text><text x="574" y="750.0" font-size="14" fill="#111" font-weight="700">dæmper: VCC (rød) · ben 1 · 3V3</text><circle cx="493" cy="745.0" r="9" fill="#e67700" stroke="#fff" stroke-width="1.5"/><text x="468" y="750.0" font-size="15" text-anchor="end" font-weight="800" fill="#111">2</text><text x="438" y="750.0" font-size="14" text-anchor="end" fill="#111" font-weight="700">skærm + (rød) · ben 2 · 5V</text><circle cx="519" cy="715.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="544" y="720.0" font-size="13" font-weight="400" fill="#999">3</text><text x="574" y="720.0" font-size="14" fill="#999" font-weight="400"></text><circle cx="493" cy="715.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="468" y="720.0" font-size="13" text-anchor="end" font-weight="400" fill="#999">4</text><text x="438" y="720.0" font-size="14" text-anchor="end" fill="#999" font-weight="400"></text><circle cx="519" cy="685.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="544" y="690.0" font-size="13" font-weight="400" fill="#999">5</text><text x="574" y="690.0" font-size="14" fill="#999" font-weight="400"></text><circle cx="493" cy="685.0" r="9" fill="#222222" stroke="#fff" stroke-width="1.5"/><text x="468" y="690.0" font-size="15" text-anchor="end" font-weight="800" fill="#111">6</text><text x="438" y="690.0" font-size="14" text-anchor="end" fill="#111" font-weight="700">skærm − (sort) · ben 6 · GND</text><circle cx="519" cy="655.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="544" y="660.0" font-size="13" font-weight="400" fill="#999">7</text><text x="574" y="660.0" font-size="14" fill="#999" font-weight="400"></text><circle cx="493" cy="655.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="468" y="660.0" font-size="13" text-anchor="end" font-weight="400" fill="#999">8</text><text x="438" y="660.0" font-size="14" text-anchor="end" fill="#999" font-weight="400"></text><circle cx="519" cy="625.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="544" y="630.0" font-size="13" font-weight="400" fill="#999">9</text><text x="574" y="630.0" font-size="14" fill="#999" font-weight="400"></text><circle cx="493" cy="625.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="468" y="630.0" font-size="13" text-anchor="end" font-weight="400" fill="#999">10</text><text x="438" y="630.0" font-size="14" text-anchor="end" fill="#999" font-weight="400"></text><circle cx="519" cy="595.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="544" y="600.0" font-size="13" font-weight="400" fill="#999">11</text><text x="574" y="600.0" font-size="14" fill="#999" font-weight="400"></text><circle cx="493" cy="595.0" r="9" fill="#1c7ed6" stroke="#fff" stroke-width="1.5"/><text x="468" y="600.0" font-size="15" text-anchor="end" font-weight="800" fill="#111">12</text><text x="438" y="600.0" font-size="14" text-anchor="end" fill="#111" font-weight="700">dæmper: signal (grøn) · ben 12 · GPIO18 PWM</text>