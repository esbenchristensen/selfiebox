ll="#999">28</text><text x="438" y="360.0" font-size="14" text-anchor="end" fill="#999" font-weight="400"></text><circle cx="519" cy="325.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="544" y="330.0" font-size="13" font-weight="400" fill="#999">29</text><text x="574" y="330.0" font-size="14" fill="#999" font-weight="400"></text><circle cx="493" cy="325.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="468" y="330.0" font-size="13" text-anchor="end" font-weight="400" fill="#999">30</text><text x="438" y="330.0" font-size="14" text-anchor="end" fill="#999" font-weight="400"></text><circle cx="519" cy="295.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="544" y="300.0" font-size="13" font-weight="400" fill="#999">31</text><text x="574" y="300.0" font-size="14" fill="#999" font-weight="400"></text><circle cx="493" cy="295.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="468" y="300.0" font-size="13" text-anchor="end" font-weight="400" fill="#999">32</text><text x="438" y="300.0" font-size="14" text-anchor="end" fill="#999" font-weight="400"></text><circle cx="519" cy="265.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="544" y="270.0" font-size="13" font-weight="400" fill="#999">33</text><text x="574" y="270.0" font-size="14" fill="#999" font-weight="400"></text><circle cx="493" cy="265.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="468" y="270.0" font-size="13" text-anchor="end" font-weight="400" fill="#999">34</text><text x="438" y="270.0" font-size="14" text-anchor="end" fill="#999" font-weight="400"></text><circle cx="519" cy="235.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="544" y="240.0" font-size="13" font-weight="400" fill="#999">35</text><text x="574" y="240.0" font-size="14" fill="#999" font-weight="400"></text><circle cx="493" cy="235.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="468" y="240.0" font-size="13" text-anchor="end" font-weight="400" fill="#999">36</text><text x="438" y="240.0" font-size="14" text-anchor="end" fill="#999" font-weight="400"></text><circle cx="519" cy="205.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="544" y="210.0" font-size="13" font-weight="400" fill="#999">37</text><text x="574" y="210.0" font-size="14" fill="#999" font-weight="400"></text><circle cx="493" cy="205.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="468" y="210.0" font-size="13" text-anchor="end" font-weight="400" fill="#999">38</text><text x="438" y="210.0" font-size="14" text-anchor="end" fill="#999" font-weight="400"></text><circle cx="519" cy="175.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="544" y="180.0" font-size="13" font-weight="400" fill="#999">39</text><text x="574" y="180.0" font-size="14" fill="#999" font-weight="400"></text><circle cx="493" cy="175.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="468" y="180.0" font-size="13" text-anchor="end" font-weight="400" fill="#999">40</text><text x="438" y="180.0" font-size="14" text-anchor="end" fill="#999" font-weight="400"></text><text x="512" y="786" font-size="14" text-anchor="middle" fill="#444">ben 1 og 2: enden længst væk fra USB</text><text x="30" y="814" font-size="14" fill="#333">G1 dæmperen: hver crimp for sig, grøn på ben 12, rød på ben 1, sort på ben 14. G4 skærmen: ben 2 og 6.</text><text x="30" y="835" font-size="14" fill="#333">RGB-styringen (Gledopto) bruger ingen Pi-ben; den får USB-kablet (U1). Dens GPIO16 er dens eget ben til stripen.</text><text x="30" y="856" font-size="14" fill="#333">Tilvalg, ikke tegnet her: reed (G2) og stødsensor (G3). Softwaren læser dem ikke endnu.</text></svg>