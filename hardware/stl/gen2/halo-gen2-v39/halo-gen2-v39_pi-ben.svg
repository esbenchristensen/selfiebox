<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="906" viewBox="0 0 1030 906" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="1030" height="906" fill="#fff"/><text x="30" y="34" font-size="26" font-weight="800">halo-gen2-v39 · Pi-ben</text><text x="30" y="74" font-size="21" font-weight="700">Raspberry Pi 5: GPIO-stikket, ben for ben</text><text x="30" y="98" font-size="14" fill="#444">Set bagfra som i boksen: fronten med forsiden nedad, Pi'ens USB-porte nedad.</text><text x="30" y="117" font-size="14" fill="#444">Stikket sidder i Pi'ens venstre kant. Ben 1 er øverst (firkantet lodning), lige ben yderst mod kanten.</text><rect x="474" y="134" width="64" height="608" rx="6" fill="#222"/><rect x="510" y="144.0" width="18" height="18" fill="#d6336c" stroke="#fff" stroke-width="1.5"/><text x="544" y="158.0" font-size="15" font-weight="800" fill="#111">1</text><text x="574" y="158.0" font-size="14" fill="#111" font-weight="700">3V3 · G1 · dæmper DFR0457, rød (3V3)</text><circle cx="493" cy="153.0" r="9" fill="#e67700" stroke="#fff" stroke-width="1.5"/><text x="468" y="158.0" font-size="15" text-anchor="end" font-weight="800" fill="#111">2</text><text x="438" y="158.0" font-size="14" text-anchor="end" fill="#111" font-weight="700">G4 · skærm, rød (5 V) · 5V</text><circle cx="519" cy="183.0" r="9" fill="#74c0fc" stroke="#fff" stroke-width="1.5"/><text x="544" y="188.0" font-size="15" font-weight="800" fill="#111">3</text><text x="574" y="188.0" font-size="14" fill="#111" font-weight="700">GPIO2 SDA · G3 · stødsensor SDA (tilvalg)</text><circle cx="493" cy="183.0" r="9" fill="#74c0fc" stroke="#fff" stroke-width="1.5"/><text x="468" y="188.0" font-size="15" text-anchor="end" font-weight="800" fill="#111">4</text><text x="438" y="188.0" font-size="14" text-anchor="end" fill="#111" font-weight="700">G3 · stødsensor VIN (tilvalg) · 5V</text><circle cx="519" cy="213.0" r="9" fill="#74c0fc" stroke="#fff" stroke-width="1.5"/><text x="544" y="218.0" font-size="15" font-weight="800" fill="#111">5</text><text x="574" y="218.0" font-size="14" fill="#111" font-weight="700">GPIO3 SCL · G3 · stødsensor SCL (tilvalg)</text><circle cx="493" cy="213.0" r="9" fill="#222222" stroke="#fff" stroke-width="1.5"/><text x="468" y="218.0" font-size="15" text-anchor="end" font-weight="800" fill="#111">6</text><text x="438" y="218.0" font-size="14" text-anchor="end" fill="#111" font-weight="700">G4 · skærm, sort (GND) · GND</text><circle cx="519" cy="243.0" r="9" fill="#74c0fc" stroke="#fff" stroke-width="1.5"/><text x="544" y="248.0" font-size="15" font-weight="800" fill="#111">7</text><text x="574" y="248.0" font-size="14" fill="#111" font-weight="700">GPIO4 · G3 · stødsensor INT (tilvalg)</text><circle cx="493" cy="243.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="468" y="248.0" font-size="15" text-anchor="end" font-weight="800" fill="#111">8</text><text x="438" y="248.0" font-size="14" text-anchor="end" fill="#999" font-weight="400">GPIO14 TXD</text><circle cx="519" cy="273.0" r="9" fill="#74c0fc" stroke="#fff" stroke-width="1.5"/><text x="544" y="278.0" font-size="15" font-weight="800" fill="#111">9</text><text x="574" y="278.0" font-size="14" fill="#111" font-weight="700">GND · G3 · stødsensor GND (tilvalg)</text><circle cx="493" cy="273.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="468" y="278.0" font-size="15" text-anchor="end" font-weight="800" fill="#111">10</text><text x="438" y="278.0" font-size="14" text-anchor="end" fill="#999" font-weight="400">GPIO15 RXD</text><circle cx="519" cy="303.0" r="9" fill="#adb5bd" stroke="#fff" stroke-width="1.5"/><text x="544" y="308.0" font-size="15" font-weight="800" fill="#111">11</text><text x="574" y="308.0" font-size="14" fill="#111" font-weight="400">GPIO17 · fri · softwarens knap-ben, lad det være</text><circle cx="493" cy="303.0" r="9" fill="#1c7ed6" stroke="#fff" stroke-width="1.5"/><text x="468" y="308.0" font-size="15" text-anchor="end" font-weight="800" fill="#111">12</text><text x="438" y="308.0" font-size="14" text-anchor="end" fill="#111" font-weight="700">G1 · dæmper, grøn: lysstyrke (PWM 20 kHz) · GPIO18 PWM</text><circle cx="519" cy="333.0" r="9" fill="#74c0fc" stroke="#fff" stroke-width="1.5"/><text x="544" y="338.0" font-size="15" font-weight="800" fill="#111">13</text><text x="574" y="338.0" font-size="14" fill="#111" font-weight="700">GPIO27 · G2 · reed, signal (tilvalg)</text><circle cx="493" cy="333.0" r="9" fill="#222222" stroke="#fff" stroke-width="1.5"/><text x="468" y="338.0" font-size="15" text-anchor="end" font-weight="800" fill="#111">14</text><text x="438" y="338.0" font-size="14" text-anchor="end" fill="#111" font-weight="700">G1 · dæmper, sort (GND) · GND</text><circle cx="519" cy="363.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="544" y="368.0" font-size="15" font-weight="800" fill="#111">15</text><text x="574" y="368.0" font-size="14" fill="#999" font-weight="400">GPIO22</text><circle cx="493" cy="363.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="468" y="368.0" font-size="15" text-anchor="end" font-weight="800" fill="#111">16</text><text x="438" y="368.0" font-size="14" text-anchor="end" fill="#999" font-weight="400">GPIO23</text><circle cx="519" cy="393.0" r="9" fill="#74c0fc" stroke="#fff" stroke-width="1.5"/><text x="544" y="398.0" font-size="15" font-weight="800" fill="#111">17</text><text x="574" y="398.0" font-size="14" fill="#111" font-weight="700">3V3 · G2 · reed, + 3V3 (tilvalg)</text><circle cx="493" cy="393.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="468" y="398.0" font-size="15" text-anchor="end" font-weight="800" fill="#111">18</text><text x="438" y="398.0" font-size="14" text-anchor="end" fill="#999" font-weight="400">GPIO24</text><circle cx="519" cy="423.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="544" y="428.0" font-size="15" font-weight="800" fill="#111">19</text><text x="574" y="428.0" font-size="14" fill="#999" font-weight="400">GPIO10</text><circle cx="493" cy="423.0" r="9" fill="#74c0fc" stroke="#fff" stroke-width="1.5"/><text x="468" y="428.0" font-size="15" text-anchor="end" font-weight="800" fill="#111">20</text><text x="438" y="428.0" font-size="14" text-anchor="end" fill="#111" font-weight="700">G2 · reed, GND (tilvalg) · GND</text><circle cx="519" cy="453.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="544" y="458.0" font-size="15" font-weight="800" fill="#111">21</text><text x="574" y="458.0" font-size="14" fill="#999" font-weight="400">GPIO9</text><circle cx="493" cy="453.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="468" y="458.0" font-size="15" text-anchor="end" font-weight="800" fill="#111">22</text><text x="438" y="458.0" font-size="14" text-anchor="end" fill="#999" font-weight="400">GPIO25</text><circle cx="519" cy="483.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="544" y="488.0" font-size="15" font-weight="800" fill="#111">23</text><text x="574" y="488.0" font-size="14" fill="#999" font-weight="400">GPIO11</text><circle cx="493" cy="483.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="468" y="488.0" font-size="15" text-anchor="end" font-weight="800" fill="#111">24</text><text x="438" y="488.0" font-size="14" text-anchor="end" fill="#999" font-weight="400">GPIO8</text><circle cx="519" cy="513.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="544" y="518.0" font-size="15" font-weight="800" fill="#111">25</text><text x="574" y="518.0" font-size="14" fill="#999" font-weight="400">GND</text><circle cx="493" cy="513.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="468" y="518.0" font-size="15" text-anchor="end" font-weight="800" fill="#111">26</text><text x="438" y="518.0" font-size="14" text-anchor="end" fill="#999" font-weight="400">GPIO7</text><circle cx="519" cy="543.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="544" y="548.0" font-size="15" font-weight="800" fill="#111">27</text><text x="574" y="548.0" font-size="14" fill="#999" font-weight="400">ID_SD</text><circle cx="493" cy="543.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="468" y="548.0" font-size="15" text-anchor="end" font-weight="800" fill="#111">28</text><text x="438" y="548.0" font-size="14" text-anchor="end" fill="#999" font-weight="400">ID_SC</text><circle cx="519" cy="573.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="544" y="578.0" font-size="15" font-weight="800" fill="#111">29</text><text x="574" y="578.0" font-size="14" fill="#999" font-weight="400">GPIO5</text><circle cx="493" cy="573.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="468" y="578.0" font-size="15" text-anchor="end" font-weight="800" fill="#111">30</text><text x="438" y="578.0" font-size="14" text-anchor="end" fill="#999" font-weight="400">GND</text><circle cx="519" cy="603.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="544" y="608.0" font-size="15" font-weight="800" fill="#111">31</text><text x="574" y="608.0" font-size="14" fill="#999" font-weight="400">GPIO6</text><circle cx="493" cy="603.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="468" y="608.0" font-size="15" text-anchor="end" font-weight="800" fill="#111">32</text><text x="438" y="608.0" font-size="14" text-anchor="end" fill="#999" font-weight="400">GPIO12</text><circle cx="519" cy="633.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="544" y="638.0" font-size="15" font-weight="800" fill="#111">33</text><text x="574" y="638.0" font-size="14" fill="#999" font-weight="400">GPIO13</text><circle cx="493" cy="633.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="468" y="638.0" font-size="15" text-anchor="end" font-weight="800" fill="#111">34</text><text x="438" y="638.0" font-size="14" text-anchor="end" fill="#999" font-weight="400">GND</text><circle cx="519" cy="663.0" r="9" fill="#adb5bd" stroke="#fff" stroke-width="1.5"/><text x="544" y="668.0" font-size="15" font-weight="800" fill="#111">35</text><text x="574" y="668.0" font-size="14" fill="#111" font-weight="400">GPIO19 · fri · optaget af PWM-overlay, brug ikke</text><circle cx="493" cy="663.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="468" y="668.0" font-size="15" text-anchor="end" font-weight="800" fill="#111">36</text><text x="438" y="668.0" font-size="14" text-anchor="end" fill="#999" font-weight="400">GPIO16</text><circle cx="519" cy="693.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="544" y="698.0" font-size="15" font-weight="800" fill="#111">37</text><text x="574" y="698.0" font-size="14" fill="#999" font-weight="400">GPIO26</text><circle cx="493" cy="693.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="468" y="698.0" font-size="15" text-anchor="end" font-weight="800" fill="#111">38</text><text x="438" y="698.0" font-size="14" text-anchor="end" fill="#999" font-weight="400">GPIO20</text><circle cx="519" cy="723.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="544" y="728.0" font-size="15" font-weight="800" fill="#111">39</text><text x="574" y="728.0" font-size="14" fill="#999" font-weight="400">GND</text><circle cx="493" cy="723.0" r="9" fill="#e9ecef" stroke="#fff" stroke-width="1.5"/><text x="468" y="728.0" font-size="15" text-anchor="end" font-weight="800" fill="#111">40</text><text x="438" y="728.0" font-size="14" text-anchor="end" fill="#999" font-weight="400">GPIO21</text><text x="512" y="764" font-size="14" text-anchor="middle" fill="#444">↓ USB-portene</text><text x="30" y="792" font-size="14" fill="#333">Fast: G1 dæmperen (ben 1, 12, 14) og G4 skærmen (ben 2, 6). Lyseblå = tilvalg, som softwaren ikke læser endnu.</text><text x="30" y="813" font-size="14" fill="#333">Grå: ben 11 er softwarens knap-ben og ben 35 er taget af PWM-overlayet. Sæt intet på dem.</text><text x="30" y="834" font-size="14" fill="#333">RGB-styringen (Gledopto) går i USB (U1). Dens GPIO16 er Gledopto'ens eget data-ben til stripen, ikke Pi'ens.</text><text x="30" y="855" font-size="14" fill="#333">Hver leder crimpes for sig på sit ben (dupont hun). Tæl fra ben 1, og tjek mod tallene her, før der tændes.</text></svg>