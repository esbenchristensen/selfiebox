<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1360" viewBox="0 0 1800 1360" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="1800" height="1360" fill="#fff"/><text x="40" y="54" font-size="32" font-weight="800">Halo gen 2 · halo-gen2-v36 · ledningsdiagram</text><text x="40" y="84" font-size="17" fill="#444">Kun købedele, ingen lodning: skrueklemmer, Wago 221-41x og klikstik. Ledningstyller på alle fintrådede ledninger, der går i en skrueklemme.</text><rect x="40" y="140" width="270" height="100" rx="14" fill="#f5f5f4" stroke="#555" stroke-width="2"/><text x="175.0" y="170" text-anchor="middle" font-size="21" font-weight="700">Strømforsyning</text><text x="175.0" y="195" text-anchor="middle" font-size="15" fill="#444">Mean Well GST90A24</text><text x="175.0" y="216" text-anchor="middle" font-size="15" fill="#444">24 V, lige stik nedefra</text><rect x="40" y="290" width="270" height="100" rx="14" fill="#f5f5f4" stroke="#555" stroke-width="2"/><text x="175.0" y="320" text-anchor="middle" font-size="21" font-weight="700">Hunstik 5,5/2,5</text><text x="175.0" y="345" text-anchor="middle" font-size="15" fill="#444">i den åbne kanal i bunden (v36)</text><text x="175.0" y="366" text-anchor="middle" font-size="15" fill="#444">skrueklemmer + og −</text><rect x="40" y="450" width="270" height="80" rx="14" fill="#f5f5f4" stroke="#555" stroke-width="2"/><text x="175.0" y="480" text-anchor="middle" font-size="21" font-weight="700">Sikring 3 A</text><text x="175.0" y="505" text-anchor="middle" font-size="15" fill="#444">inline-holder på højre væg (v36)</text><text x="175.0" y="526" text-anchor="middle" font-size="15" fill="#444">fladsikring ATO (violet), kun på +</text><path d="M175,240 L175,290" fill="none" stroke="#d62828" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text x="185" y="270" font-size="14" fill="#d62828" font-weight="600" text-anchor="start">24 V</text><rect x="560" y="150" width="58" height="118" rx="8" fill="#fff" stroke="#d62828" stroke-width="4"/><rect x="576" y="160" width="26" height="26" rx="4" fill="#ff922b" stroke="#a65800"/><rect x="576" y="194" width="26" height="26" rx="4" fill="#ff922b" stroke="#a65800"/><rect x="576" y="228" width="26" height="26" rx="4" fill="#ff922b" stroke="#a65800"/><text x="589" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#d62828">W1 · 24 V + </text><rect x="560" y="430" width="58" height="186" rx="8" fill="#fff" stroke="#222222" stroke-width="4"/><rect x="576" y="440" width="26" height="26" rx="4" fill="#ff922b" stroke="#a65800"/><rect x="576" y="474" width="26" height="26" rx="4" fill="#ff922b" stroke="#a65800"/><rect x="576" y="508" width="26" height="26" rx="4" fill="#ff922b" stroke="#a65800"/><rect x="576" y="542" width="26" height="26" rx="4" fill="#ff922b" stroke="#a65800"/><rect x="576" y="576" width="26" height="26" rx="4" fill="#ff922b" stroke="#a65800"/><text x="550" y="480" text-anchor="end" font-size="16" font-weight="700" fill="#222222">W2 · GND </text><path d="M120,390 L120,450" fill="none" stroke="#d62828" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="130" y="425" font-size="14" fill="#d62828" font-weight="600" text-anchor="start">P1 · +</text><path d="M120,530 L120,600 L420,600 L420,173 L560,173" fill="none" stroke="#d62828" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="430" y="167" font-size="14" fill="#d62828" font-weight="600" text-anchor="start">P1b · fra sikring</text><path d="M250,390 L250,420 L460,420 L460,453 L560,453" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="470" y="447" font-size="14" fill="#333" font-weight="600" text-anchor="start">P2 · fra hunstik −</text><text x="40" y="640" font-size="14" fill="#444" font-weight="600" text-anchor="start">Strøm: 1,5 mm² RKUB (Biltema), v36</text><rect x="840" y="130" width="300" height="210" rx="14" fill="#f5f5f4" stroke="#555" stroke-width="2"/><text x="990.0" y="160" text-anchor="middle" font-size="21" font-weight="700">5 V-forsyning</text><text x="990.0" y="185" text-anchor="middle" font-size="15" fill="#444">Mean Well RSD-60G-5</text><text x="990.0" y="206" text-anchor="middle" font-size="15" fill="#444">DC IN øverst: V+ · V−</text><text x="990.0" y="227" text-anchor="middle" font-size="15" fill="#444">DC OUT nederst: +V · −V</text><text x="990.0" y="248" text-anchor="middle" font-size="15" fill="#444">isoleret: −V bindes til</text><text x="990.0" y="269" text-anchor="middle" font-size="15" fill="#444">GND (bro W4 → W2)</text><path d="M618,207 L840,207" fill="none" stroke="#d62828" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="830" y="201" font-size="14" fill="#d62828" font-weight="600" text-anchor="end">P3 · Vin+</text><path d="M618,487 L800,487 L800,310 L840,310" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="830" y="304" font-size="14" fill="#222" font-weight="600" text-anchor="end">P4 · Vin−</text><rect x="1230" y="150" width="58" height="152" rx="8" fill="#fff" stroke="#e67700" stroke-width="4"/><rect x="1246" y="160" width="26" height="26" rx="4" fill="#ff922b" stroke="#a65800"/><rect x="1246" y="194" width="26" height="26" rx="4" fill="#ff922b" stroke="#a65800"/><rect x="1246" y="228" width="26" height="26" rx="4" fill="#ff922b" stroke="#a65800"/><rect x="1246" y="262" width="26" height="26" rx="4" fill="#ff922b" stroke="#a65800"/><text x="1259" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#e67700">W3 · 5 V + </text><rect x="1230" y="370" width="58" height="186" rx="8" fill="#fff" stroke="#222222" stroke-width="4"/><rect x="1246" y="380" width="26" height="26" rx="4" fill="#ff922b" stroke="#a65800"/><rect x="1246" y="414" width="26" height="26" rx="4" fill="#ff922b" stroke="#a65800"/><rect x="1246" y="448" width="26" height="26" rx="4" fill="#ff922b" stroke="#a65800"/><rect x="1246" y="482" width="26" height="26" rx="4" fill="#ff922b" stroke="#a65800"/><rect x="1246" y="516" width="26" height="26" rx="4" fill="#ff922b" stroke="#a65800"/><text x="1259" y="358" text-anchor="middle" font-size="16" font-weight="700" fill="#222222">W4 · 5 V GND </text><path d="M1140,180 L1180,180 L1180,173 L1230,173" fill="none" stroke="#e67700" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="1150" y="172" font-size="14" fill="#e67700" font-weight="600" text-anchor="start">+V · P5</text><path d="M1140,250 L1200,250 L1200,393 L1230,393" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="1150" y="242" font-size="14" fill="#222" font-weight="600" text-anchor="start">−V · P6</text><rect x="1440" y="150" width="320" height="300" rx="14" fill="#f5f5f4" stroke="#555" stroke-width="2"/><text x="1600.0" y="180" text-anchor="middle" font-size="21" font-weight="700">Raspberry Pi 5</text><text x="1600.0" y="205" text-anchor="middle" font-size="15" fill="#444">USB-C: Joy-IT K-1474 (5 A),</text><text x="1600.0" y="226" text-anchor="middle" font-size="15" fill="#444">klippet til ca. 20 cm</text><text x="1600.0" y="247" text-anchor="middle" font-size="15" fill="#444">config.txt:</text><text x="1600.0" y="268" text-anchor="middle" font-size="15" fill="#444">usb_max_current_enable=1</text><text x="1600.0" y="289" text-anchor="middle" font-size="15" fill="#444">PWM: dtoverlay=pwm-2chan</text><text x="1600.0" y="310" text-anchor="middle" font-size="15" fill="#444">(sættes af box/system)</text><path d="M1288,207 L1440,207" fill="none" stroke="#e67700" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="1300" y="201" font-size="14" fill="#e67700" font-weight="600" text-anchor="start">P12 · USB-C rød</text><path d="M1288,427 L1440,427" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="1300" y="421" font-size="14" fill="#333" font-weight="600" text-anchor="start">P12 · USB-C sort</text><rect x="1440" y="560" width="320" height="150" rx="14" fill="#fff4e6" stroke="#555" stroke-width="2"/><text x="1600.0" y="590" text-anchor="middle" font-size="21" font-weight="700">RGB-styring</text><text x="1600.0" y="615" text-anchor="middle" font-size="15" fill="#444">Gledopto GL-C-016WL-D</text><text x="1600.0" y="636" text-anchor="middle" font-size="15" fill="#444">5 V, ALDRIG 24 V</text><text x="1600.0" y="657" text-anchor="middle" font-size="15" fill="#444">ind V+ V− nederst</text><text x="1600.0" y="678" text-anchor="middle" font-size="15" fill="#444">GPIO16 og USB-C øverst</text><path d="M1288,241 L1320,241 L1320,600 L1440,600" fill="none" stroke="#e67700" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="1430" y="594" font-size="14" fill="#e67700" font-weight="600" text-anchor="end">P13 · V+</text><path d="M1288,461 L1340,461 L1340,650 L1440,650" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="1430" y="644" font-size="14" fill="#222" font-weight="600" text-anchor="end">P14 · V−</text><rect x="1440" y="860" width="320" height="100" rx="14" fill="#f3e8ff" stroke="#555" stroke-width="2"/><text x="1600.0" y="890" text-anchor="middle" font-size="21" font-weight="700">RGB-strip 5 V</text><text x="1600.0" y="915" text-anchor="middle" font-size="15" fill="#444">WS2812b COB 5 mm, MiniClip i IN-enden</text><text x="1600.0" y="936" text-anchor="middle" font-size="15" fill="#444">strømloft 2 A (2000 mA) i WLED</text><path d="M1288,275 L1400,275 L1400,790 L1500,790 L1500,860" fill="none" stroke="#e67700" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="1492" y="820" font-size="14" fill="#e67700" font-weight="600" text-anchor="end">S1 · 5 V fra W3</text><path d="M1600,710 L1600,860" fill="none" stroke="#9c36b5" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="1608" y="790" font-size="14" fill="#9c36b5" font-weight="600" text-anchor="start">S3 · DATA (GPIO16)</text><path d="M1288,529 L1380,529 L1380,840 L1700,840 L1700,860" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="1708" y="832" font-size="14" fill="#333" font-weight="600" text-anchor="start">S2 · GND</text><text x="1600" y="990" font-size="14" fill="#444" font-weight="600" text-anchor="middle">RGB: strippens egne ledninger direkte i W3/W4</text><path d="M1745,450 L1745,560" fill="none" stroke="#1c7ed6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="1735" y="520" font-size="14" fill="#1c7ed6" font-weight="600" text-anchor="end">U1 · USB-A → USB-C</text><text x="1735" y="540" font-size="14" fill="#1c7ed6" font-weight="600" text-anchor="end">styring (serial)</text><path d="M1288,495 L1300,495 L1300,520 L700,520 L700,555 L618,555" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="720" y="512" font-size="14" fill="#333" font-weight="600" text-anchor="start">P7 · bro W4 → W2: fælles GND til dæmperens styresignal</text><rect x="840" y="640" width="300" height="160" rx="14" fill="#f5f5f4" stroke="#555" stroke-width="2"/><text x="990.0" y="670" text-anchor="middle" font-size="21" font-weight="700">Dæmper hvidt lys</text><text x="990.0" y="695" text-anchor="middle" font-size="15" fill="#444">DFRobot DFR0457</text><text x="990.0" y="716" text-anchor="middle" font-size="15" fill="#444">klemmer øverst: VOUT · GND · VIN</text><text x="990.0" y="737" text-anchor="middle" font-size="15" fill="#444">VOUT = dæmpet + til strips</text><text x="990.0" y="758" text-anchor="middle" font-size="15" fill="#444">Gravity-stik nederst</text><path d="M618,241 L660,241 L660,680 L840,680" fill="none" stroke="#d62828" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="830" y="674" font-size="14" fill="#d62828" font-weight="600" text-anchor="end">P9 · VIN</text><path d="M618,521 L680,521 L680,720 L840,720" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="830" y="714" font-size="14" fill="#222" font-weight="600" text-anchor="end">P10 · GND</text><path d="M1440,300 L1170,300 L1170,700 L1140,700" fill="none" stroke="#1c7ed6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M1440,330 L1185,330 L1185,760 L1140,760" fill="none" stroke="#1c7ed6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="1195" y="700" font-size="14" fill="#1c7ed6" font-weight="600" text-anchor="start">grøn → GPIO18 (ben 12), 20 kHz</text><text x="1195" y="760" font-size="14" fill="#1c7ed6" font-weight="600" text-anchor="start">rød → 3V3 (ben 1) · sort → GND (ben 14)</text><text x="1195" y="782" font-size="14" fill="#1c7ed6" font-weight="600" text-anchor="start">G1: 3 ledere, 40 cm, hver crimp for sig på sit ben</text><rect x="960" y="880" width="58" height="118" rx="8" fill="#fff" stroke="#868e96" stroke-width="4"/><rect x="976" y="890" width="26" height="26" rx="4" fill="#ff922b" stroke="#a65800"/><rect x="976" y="924" width="26" height="26" rx="4" fill="#ff922b" stroke="#a65800"/><rect x="976" y="958" width="26" height="26" rx="4" fill="#ff922b" stroke="#a65800"/><text x="1030" y="905" text-anchor="start" font-size="16" font-weight="700" fill="#868e96">W6 · hvid + (dæmpet) </text><path d="M990,800 L990,860 L940,860 L940,903 L960,903" fill="none" stroke="#868e96" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="1000" y="845" font-size="14" fill="#555" font-weight="600" text-anchor="start">P11 · VOUT</text><rect x="700" y="880" width="58" height="118" rx="8" fill="#fff" stroke="#222222" stroke-width="4"/><rect x="716" y="890" width="26" height="26" rx="4" fill="#ff922b" stroke="#a65800"/><rect x="716" y="924" width="26" height="26" rx="4" fill="#ff922b" stroke="#a65800"/><rect x="716" y="958" width="26" height="26" rx="4" fill="#ff922b" stroke="#a65800"/><text x="729" y="868" text-anchor="middle" font-size="16" font-weight="700" fill="#222222">W5 · hvid − </text><path d="M618,589 L640,589 L640,860 L680,860 L680,903 L700,903" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="650" y="850" font-size="14" fill="#222" font-weight="600" text-anchor="start">P8 · fra W2</text><rect x="1100" y="1040" width="300" height="190" rx="14" fill="#fffbe6" stroke="#555" stroke-width="2"/><text x="1250.0" y="1070" text-anchor="middle" font-size="21" font-weight="700">Hvid strip 1 og 2</text><text x="1250.0" y="1095" text-anchor="middle" font-size="15" fill="#444">Ledproff COB Ra95 24 V, 8 mm</text><text x="1250.0" y="1116" text-anchor="middle" font-size="15" fill="#444">klikstik, 0,35 mm²</text><text x="1250.0" y="1137" text-anchor="middle" font-size="15" fill="#444">(v24: kun 2, ingen strip</text><text x="1250.0" y="1158" text-anchor="middle" font-size="15" fill="#444">i reflektoren)</text><path d="M1018,937 L1180,937 L1180,1040" fill="none" stroke="#868e96" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="1190" y="931" font-size="14" fill="#555" font-weight="600" text-anchor="start">S4 · strip 1 +</text><path d="M1018,971 L1140,971 L1140,1040" fill="none" stroke="#868e96" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="1150" y="989" font-size="14" fill="#555" font-weight="600" text-anchor="start">S6 · strip 2 +</text><path d="M758,937 L800,937 L800,1080 L1100,1080" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="810" y="1074" font-size="14" fill="#222" font-weight="600" text-anchor="start">S5 · strip 1 −</text><path d="M758,971 L780,971 L780,1180 L1100,1180" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="790" y="1174" font-size="14" fill="#222" font-weight="600" text-anchor="start">S7 · strip 2 −</text><text x="40" y="980" font-size="15" fill="#333" font-weight="600" text-anchor="start">W1 24 V +: 221-413</text><text x="40" y="1002" font-size="15" fill="#333" font-weight="600" text-anchor="start">W2 GND: 221-415</text><text x="40" y="1024" font-size="15" fill="#333" font-weight="600" text-anchor="start">W3 5 V +: 221-414</text><text x="40" y="1046" font-size="15" fill="#333" font-weight="600" text-anchor="start">W4 5 V GND: 221-415</text><text x="40" y="1068" font-size="15" fill="#333" font-weight="600" text-anchor="start">W5 hvid −: 221-413</text><text x="40" y="1090" font-size="15" fill="#333" font-weight="600" text-anchor="start">W6 hvid + dæmpet: 221-413</text><line x1="40" y1="740" x2="86" y2="740" stroke="#d62828" stroke-width="6"/><text x="98" y="745" font-size="16">24 V</text><line x1="40" y1="772" x2="86" y2="772" stroke="#e67700" stroke-width="6"/><text x="98" y="777" font-size="16">5 V</text><line x1="40" y1="804" x2="86" y2="804" stroke="#222222" stroke-width="6"/><text x="98" y="809" font-size="16">GND (fælles)</text><line x1="40" y1="836" x2="86" y2="836" stroke="#868e96" stroke-width="6"/><text x="98" y="841" font-size="16">hvid strip +, dæmpet (VOUT)</text><line x1="40" y1="868" x2="86" y2="868" stroke="#1c7ed6" stroke-width="6"/><text x="98" y="873" font-size="16">styresignal fra Pi</text><line x1="40" y1="900" x2="86" y2="900" stroke="#9c36b5" stroke-width="6"/><text x="98" y="905" font-size="16">data til RGB</text><rect x="1440" y="1030" width="330" height="250" rx="14" fill="#e7f5ff" stroke="#555" stroke-width="2"/><text x="1605.0" y="1060" text-anchor="middle" font-size="21" font-weight="700">Data fra Pi'en</text><text x="1605.0" y="1085" text-anchor="middle" font-size="15" fill="#444">U1 USB-A → RGB-styring (USB-C)</text><text x="1605.0" y="1106" text-anchor="middle" font-size="15" fill="#444">U2 USB-A → mikrofon-kerne (USB-C)</text><text x="1605.0" y="1127" text-anchor="middle" font-size="15" fill="#444">U3 USB-A → 4G (tilvalg) · alle 90° stik</text><text x="1605.0" y="1148" text-anchor="middle" font-size="15" fill="#444">G2 ben 13 · 17 · 20 → reed (tilvalg)</text><text x="1605.0" y="1169" text-anchor="middle" font-size="15" fill="#444">G3 ben 3 · 4 · 5 · 7 · 9 → stødsensor (tilvalg)</text><text x="1605.0" y="1190" text-anchor="middle" font-size="15" fill="#444">G4 ben 2 · 6 → skærmens strøm</text><text x="1605.0" y="1211" text-anchor="middle" font-size="15" fill="#444">F1 kamera · F2 skærm · F3 mikrofoner: flade</text><text x="1605.0" y="1232" text-anchor="middle" font-size="15" fill="#444">A1 højttaler → kernens SPEAKER-stik</text><text x="40" y="1285" font-size="15" fill="#444" font-weight="600" text-anchor="start">Kabel-id'erne (P, S, U, G, A, F) er de samme som i ledningsplanen, hvor rute, bane og længde står.</text><text x="40" y="1307" font-size="15" fill="#444" font-weight="600" text-anchor="start">Skærmen får strøm fra Pi'ens ben 2 (5 V, yderst i hjørnet) og 6 (GND) med sit eget kabel (G4).</text><text x="40" y="1329" font-size="15" fill="#444" font-weight="600" text-anchor="start">Mærkningen på dæmperen og styringen gælder: tjek den, før der tændes.</text></svg>