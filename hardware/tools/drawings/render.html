<!doctype html>
<meta charset="utf-8">
<title>Halo drawings</title>
<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<body style="margin:0;background:#fff">
<script>
// Drawing-sheet generator for the Halo selfiebox, driven by render_drawings.js.
// Sheet kinds (drawings.json):
//   part      orthographic views with hidden lines removed, overall + feature dims, notes,
//             every hole / insert from hardware.json marked with an ID, and a hole table
//   assembly  exploded or assembled view with position balloons and a parts list
//   detail    shaded technical illustration of one fastening operation with callouts
// All coordinates in drawings.json are in the part's OpenSCAD frame (x right, y depth, z up).
const PX = 2.6;                                  // px per mm for part sheets
const INK = "#16161a", DIM = "#2a5bd7", NOTE = "#b3361f", GREY = "#6a6a72", AMBER = "#e39a1c";
const FONT = "'DejaVu Sans', Arial, sans-serif";
let PACK = null, HW = null;
window.ready = Promise.all([
  new Promise(res => new THREE.GLTFLoader().load("pack.json", g => { PACK = g.scene; PACK.updateMatrixWorld(true); res(); })),
  fetch("hardware.json").then(r => r.json()).then(j => { HW = j; })
]);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setClearColor(0xffffff, 1);
renderer.outputEncoding = THREE.sRGBEncoding;

const S2G = p => new THREE.Vector3(p[0], p[2], -p[1]);
const VIEWS = {
  front: { name: "Forfra", dir: [0, 0, 1], up: [0, 1, 0] }, back: { name: "Bagfra", dir: [0, 0, -1], up: [0, 1, 0] },
  side: { name: "Fra højre", dir: [1, 0, 0], up: [0, 1, 0] }, left: { name: "Fra venstre", dir: [-1, 0, 0], up: [0, 1, 0] },
  top: { name: "Oppefra", dir: [0, 1, 0], up: [0, 0, -1] }, bottom: { name: "Nedefra", dir: [0, -1, 0], up: [0, 0, 1] },
  iso: { name: "Isometri", dir: [-1, 0.75, 1.15], up: [0, 1, 0] }, isoback: { name: "Isometri bagfra", dir: [1, 0.7, -1.15], up: [0, 1, 0] }
};
// group frames: attachments are stored in their own frame; stack them like the real build
const GROUP = n => {
  if (n.startsWith("hw--")) { const g = n.split("--")[1]; return g === "photo" ? "strip" : g; }
  if (n.includes("--")) { const p = n.split("--")[1].split("__")[0]; return p.startsWith("wing") ? "unit" : p === "topper" ? "topper" : "strip"; }
  if (/^(instax_|v_instax)/.test(n)) return "strip";
  if (n === "roof") return "roof"; if (n === "joint_spacer") return "spacer";
  return "unit";
};
function hwIndex(n) { return n.startsWith("hw--") ? +n.split("--").pop() : -1; }

// ------------------------------------------------------------------ colours (shaded style)
function colourOf(n) {
  if (n.startsWith("hw--")) { const k = n.split("--")[3]; return k.startsWith("ins") ? 0xc9973f : k.startsWith("dowel") ? 0xb8bac2 : k.startsWith("wood") ? 0xc8c8cc : 0x34343a; }
  if (n.includes("--")) { const c = n.split("__")[1]; return { base: 0x4a4a52, forest: 0x0f5c3e, leaf: 0x2e8b57, lilac: 0xb48ac9, coral: 0xe8553d, cream: 0xf3e3d3, magenta: 0xff2fb4, cyan: 0x22e6ff, lime: 0xc8ff3a }[c] || 0x4a4a52; }
  if (/_band$/.test(n) || n === "diffuser_ring") return 0xeee8dc;
  return { v_display: 0x23252c, v_pi: 0x2f8a55, v_camera: 0x2f8a55, v_power: 0x2c62b0, v_pol9: 0x2c62b0, v_pads: 0x9a9aa0, v_leds: 0xfff0c0, v_printer: 0x3a3a40, v_instax: 0xe9e8e4 }[n] || 0x5a5a62;
}

function nodeMeshes(name) {
  const out = [];
  PACK.traverse(o => { if (o.isMesh && (o.name || o.parent.name || "").replace(/_\d+$/, "") === name) out.push(o); });
  if (!out.length) PACK.traverse(o => { if (o.isMesh && (o.parent && o.parent.name === name)) out.push(o); });
  return out;
}
// Build a scene object for the listed nodes. opts: style, place (group z offsets), explode (name -> scad offset),
// pull (mm screws are drawn out of their hole along their axis), hl (names drawn amber)
function build(names, opts) {
  const grp = new THREE.Group();
  const style = opts.style || "line";
  names.forEach(n => nodeMeshes(n).forEach(o => {
    let geo = o.geometry.clone(); o.updateWorldMatrix(true, false); geo.applyMatrix4(o.matrixWorld);
    if (style !== "line") { geo = geo.index ? geo.toNonIndexed() : geo; geo.computeVertexNormals(); }
    let off = new THREE.Vector3(0, (opts.place || {})[GROUP(n)] || 0, 0);
    const E = opts.explode || {};
    const ex = E[n] || (n.startsWith("hw--") && E[n.split("--")[4]]) || (Object.entries(E).find(([k]) => k.endsWith("*") && n.startsWith(k.slice(0, -1))) || [])[1];
    if (ex) off.add(S2G(ex));
    const i = hwIndex(n);
    if (i >= 0 && opts.pull) { const e = HW.HW_LIST[i], k = /^(ins|dowel)/.test(e[2]) ? opts.pull * 0.6 : opts.pull; off.add(S2G(e[4]).multiplyScalar(-k)); }
    let mat;
    if (style === "line") mat = new THREE.MeshBasicMaterial({ color: 0xffffff, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
    else {
      const hl = (opts.hl || []).includes(n) || (opts.hl || []).some(h => n.startsWith("hw--") && n.split("--")[4] === h && opts.hlhw);
      mat = new THREE.MeshLambertMaterial({ color: hl ? 0xf2b24b : colourOf(n), polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
    }
    const m = new THREE.Mesh(geo, mat); m.position.copy(off); m.userData.name = n; grp.add(m);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo, style === "line" ? 28 : 34),
      new THREE.LineBasicMaterial({ color: style === "line" ? 0x16161a : 0x111114 }));
    edges.position.copy(off); edges.userData.name = n; grp.add(edges);
  }));
  return grp;
}

function basis(view) {
  const V = typeof view === "string" ? VIEWS[view] : view;
  const dir = new THREE.Vector3(...V.dir).normalize(), up = new THREE.Vector3(...V.up);
  const r = new THREE.Vector3().crossVectors(up, dir).normalize();
  const u = new THREE.Vector3().crossVectors(dir, r).normalize();
  return { dir, r, u, name: V.name };
}
// orthographic render of obj; returns image + a projector from glTF points to image px
function renderView(obj, view, px, box) {
  const B = basis(view);
  const bb = box || new THREE.Box3().setFromObject(obj);
  let h0 = 1e9, h1 = -1e9, v0 = 1e9, v1 = -1e9;
  for (const x of [bb.min.x, bb.max.x]) for (const y of [bb.min.y, bb.max.y]) for (const z of [bb.min.z, bb.max.z]) {
    const p = new THREE.Vector3(x, y, z), h = p.dot(B.r), v = p.dot(B.u);
    h0 = Math.min(h0, h); h1 = Math.max(h1, h); v0 = Math.min(v0, v); v1 = Math.max(v1, v);
  }
  const w = Math.ceil((h1 - h0) * px) + 4, ht = Math.ceil((v1 - v0) * px) + 4;
  const c = bb.getCenter(new THREE.Vector3()), R = bb.getSize(new THREE.Vector3()).length() + 200;
  const t = B.r.clone().multiplyScalar((h0 + h1) / 2).add(B.u.clone().multiplyScalar((v0 + v1) / 2)).add(B.dir.clone().multiplyScalar(c.dot(B.dir)));
  const cam = new THREE.OrthographicCamera(-w / 2 / px, w / 2 / px, ht / 2 / px, -ht / 2 / px, 0.1, R * 4);
  cam.up.copy(B.u); cam.position.copy(t).addScaledVector(B.dir, R * 2); cam.lookAt(t);
  const scene = new THREE.Scene(); scene.add(obj);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x9a9aa6, 0.75));
  const key = new THREE.DirectionalLight(0xffffff, 0.55); key.position.copy(B.dir).add(new THREE.Vector3(-0.4, 0.8, 0.3)).multiplyScalar(1000); scene.add(key);
  renderer.setPixelRatio(1); renderer.setSize(w, ht); renderer.render(scene, cam);
  const img = document.createElement("canvas"); img.width = w; img.height = ht; img.getContext("2d").drawImage(renderer.domElement, 0, 0);
  scene.remove(obj);
  const proj = g => [2 + (g.dot(B.r) - h0) * px, 2 + (v1 - g.dot(B.u)) * px];
  return { img, w, ht, proj, name: B.name, size: [h1 - h0, v1 - v0], B };
}

// ------------------------------------------------------------------ 2D annotation helpers
const fmt = x => (Math.round(x * 10) / 10).toString().replace(".", ",");
function arrow(g, x, y, ang) { g.beginPath(); g.moveTo(x, y); g.lineTo(x - 9 * Math.cos(ang - 0.3), y - 9 * Math.sin(ang - 0.3)); g.lineTo(x - 9 * Math.cos(ang + 0.3), y - 9 * Math.sin(ang + 0.3)); g.closePath(); g.fill(); }
function dim(g, a, b, off, label) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy); if (L < 1) return;
  const nx = -dy / L, ny = dx / L, sg = Math.sign(off) || 1;
  const A = [a[0] + nx * off, a[1] + ny * off], B = [b[0] + nx * off, b[1] + ny * off];
  g.strokeStyle = DIM; g.fillStyle = DIM; g.lineWidth = 1; g.beginPath();
  if (off) { g.moveTo(a[0] + nx * sg * 3, a[1] + ny * sg * 3); g.lineTo(A[0] + nx * sg * 6, A[1] + ny * sg * 6); g.moveTo(b[0] + nx * sg * 3, b[1] + ny * sg * 3); g.lineTo(B[0] + nx * sg * 6, B[1] + ny * sg * 6); }
  g.moveTo(A[0], A[1]); g.lineTo(B[0], B[1]); g.stroke();
  const ang = Math.atan2(B[1] - A[1], B[0] - A[0]); arrow(g, B[0], B[1], ang); arrow(g, A[0], A[1], ang + Math.PI);
  g.save(); g.translate((A[0] + B[0]) / 2, (A[1] + B[1]) / 2); let r = ang; if (r > Math.PI / 2 || r < -Math.PI / 2) r += Math.PI; g.rotate(r);
  g.font = `600 15px ${FONT}`; g.textAlign = "center"; const t = label || fmt(L / PX), tw = g.measureText(t).width;
  g.fillStyle = "rgba(255,255,255,0.92)"; g.fillRect(-tw / 2 - 3, -19, tw + 6, 17); g.fillStyle = DIM; g.fillText(t, 0, -5); g.restore();
}
function note(g, p, text, dx, dy, color) {
  const right = dx > 0, tx = p[0] + dx, ty = p[1] + dy, col = color || NOTE;
  g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 1.3;
  g.beginPath(); g.arc(p[0], p[1], 3.5, 0, 7); g.fill();
  g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(tx, ty); g.lineTo(tx + (right ? 8 : -8), ty); g.stroke();
  const lines = String(text).split("\n"); g.font = `500 14px ${FONT}`; g.textAlign = right ? "left" : "right";
  const tw = Math.max(...lines.map(l => g.measureText(l).width));
  let x0 = right ? tx + 11 : tx - 11 - tw;
  if (x0 < 18) { const sh = 18 - x0; x0 += sh; g.beginPath(); g.moveTo(tx, ty); g.lineTo(tx + sh, ty); g.stroke(); }
  const xt = right ? x0 : x0 + tw;
  g.fillStyle = "rgba(255,255,255,0.94)"; g.fillRect(x0 - 3, ty - 13, tw + 6, 18 * lines.length);
  g.fillStyle = col; lines.forEach((l, i) => g.fillText(l, xt, ty + 1 + i * 18));
}
function marker(g, p, id, kind) {
  const col = { ins: "#b07a12", pilot: "#7a3fb0", clear: "#2a5bd7", cut: "#555" }[kind] || INK;
  g.strokeStyle = col; g.lineWidth = 1.6; g.beginPath(); g.arc(p[0], p[1], 7, 0, 7); g.stroke();
  g.beginPath(); g.moveTo(p[0] - 11, p[1]); g.lineTo(p[0] + 11, p[1]); g.moveTo(p[0], p[1] - 11); g.lineTo(p[0], p[1] + 11); g.stroke();
  g.font = `700 13px ${FONT}`; g.textAlign = "left"; const tw = g.measureText(id).width;
  g.fillStyle = "rgba(255,255,255,0.95)"; g.fillRect(p[0] + 9, p[1] - 22, tw + 6, 16);
  g.fillStyle = col; g.fillText(id, p[0] + 12, p[1] - 9);
}
function frame(g, W, H, title, cols) {
  g.strokeStyle = INK; g.lineWidth = 2; g.strokeRect(10, 10, W - 20, H - 20);
  const ty = H - 102; g.lineWidth = 1.5; g.beginPath(); g.moveTo(10, ty); g.lineTo(W - 10, ty); g.stroke();
  const xs = [20, W * 0.40, W * 0.62, W * 0.84];
  cols.forEach(([k, val], i) => {
    const x = xs[i]; if (i) { g.beginPath(); g.moveTo(x - 10, ty); g.lineTo(x - 10, H - 10); g.stroke(); }
    g.fillStyle = GREY; g.font = `600 12px ${FONT}`; g.textAlign = "left"; g.fillText(k, x, ty + 22);
    g.fillStyle = INK; g.font = (i ? "500 15px " : "700 20px ") + FONT;
    let v = String(val); while (g.measureText(v).width > (i < 3 ? xs[i + 1] - x - 20 : W - x - 30) && v.length > 4) v = v.slice(0, -2);
    g.fillText(v === String(val) ? v : v + "…", x, ty + 50);
  });
  g.fillStyle = GREY; g.font = `500 12px ${FONT}`;
  g.fillText("Selfiebox Halo rev G · tegnet fra CAD-modellen hardware/cad/halo.scad · alle mål i mm · tolerance ±0,2 medmindre andet er angivet", 20, H - 22);
  g.font = `800 22px ${FONT}`; g.fillStyle = INK; g.fillText(title, 20, 44);
}
function table(g, x, y, cols, rows, opts = {}) {
  const rh = opts.rh || 21, ws = cols.map(c => c[1]);
  g.font = `700 12px ${FONT}`; g.fillStyle = "#f0f0f2"; g.fillRect(x, y, ws.reduce((a, b) => a + b, 0), rh);
  g.strokeStyle = "#bbbbc2"; g.lineWidth = 1;
  let cx = x; cols.forEach(([h, w]) => { g.fillStyle = INK; g.textAlign = "left"; g.fillText(h, cx + 6, y + 15); cx += w; });
  rows.forEach((r, i) => {
    const yy = y + rh * (i + 1); g.beginPath(); g.moveTo(x, yy); g.lineTo(x + ws.reduce((a, b) => a + b, 0), yy); g.stroke();
    let c2 = x; r.forEach((cell, j) => {
      g.font = (j === 0 ? "700 " : "400 ") + `12.5px ${FONT}`; g.fillStyle = j === 0 && opts.idColor ? opts.idColor(cell, r) : INK;
      let v = String(cell); while (g.measureText(v).width > ws[j] - 10 && v.length > 3) v = v.slice(0, -2);
      g.fillText(v, c2 + 6, yy + 15); c2 += ws[j];
    });
  });
  g.strokeRect(x, y, ws.reduce((a, b) => a + b, 0), rh * (rows.length + 1));
  return rh * (rows.length + 1);
}

// ------------------------------------------------------------------ hole data for a part sheet
const ALIAS = { shell_closed: "shell", "sommernat--topper__base": "topper", "sommernat--wing_right__base": "wing", "sommernat--wing_left__base": "wing" };
const INS_TXT = { ins_m3: ["M3 messingindsats", 4.0, 6.4], ins_m4: ["M4 messingindsats", 5.6, 8.2], ins_q: ['1/4"-20 indsats (stativ)', 7.9, 12.5] };
function entrySide(d) {
  const [x, y, z] = d;
  if (Math.abs(x) > 0.5) return x > 0 ? "fra venstre" : "fra højre";
  if (Math.abs(y) > 0.5) return y > 0 ? "forfra" : "bagfra";
  return z > 0 ? "nedefra" : "oppefra";
}
function holesFor(node, skipTop) {
  const part = ALIAS[node] || node, list = [];
  HW.HW_LIST.forEach(([grp, owner, kind, pos, d, when]) => {
    if (owner !== part || !INS_TXT[kind]) return;
    const [lab, dia, dep] = INS_TXT[kind]; list.push({ lab, dia, dep, pos, d, kind: "ins" });
  });
  HW.HOLE_LIST.forEach(([owner, lab, pos, d, dia, dep]) => {
    if (owner !== part) return;
    if (skipTop && / top/.test(lab)) return;
    list.push({ lab, dia, dep, pos, d, kind: /Pilot/.test(lab) ? "pilot" : /Udskæring|Kabel|bøsning|Gennemføring|Kamerahul/.test(lab) ? "cut" : "clear" });
  });
  // IDs: one letter per hole type, number per instance
  const keyOf = h => h.lab + "|" + h.dia + "|" + h.dep; const letters = {}; let next = 0;
  list.forEach(h => { const k = keyOf(h); if (!(k in letters)) letters[k] = { L: "ABCDEFGHIJKLMNOPQRSTUVWXYZ"[next++], n: 0 }; h.id = letters[k].L + (++letters[k].n); });
  return list;
}
function viewForHole(h, views) {
  const [x, y, z] = h.d, has = v => views.includes(v);
  if (Math.abs(y) > 0.5) return y < 0 && has("back") ? "back" : has("front") ? "front" : has("back") ? "back" : null;
  if (Math.abs(x) > 0.5) return has("side") ? "side" : null;
  return z > 0 && has("bottom") ? "bottom" : has("top") ? "top" : has("bottom") ? "bottom" : null;
}

// ------------------------------------------------------------------ sheet: part
function partSheet(spec) {
  const obj = build(spec.nodes ? expandNames(spec.nodes) : [spec.node], { style: "line", place: spec.place });
  if (!obj.children.length) throw new Error("no part " + spec.node);
  const views = spec.views.map(k => ({ key: k, ...renderView(obj, k, PX) }));
  const holes = spec.holes === false || spec.nodes ? [] : holesFor(spec.node, spec.skipTop);
  const G = 90, head = 70, main = views[0], rest = views.slice(1);
  const colW = Math.max(0, ...rest.map(v => v.w));
  const W = Math.max(1500, G + main.w + G + (rest.length ? colW + G : 0));
  const restH = rest.reduce((s, v) => s + v.ht + G, 0);
  const rows = holes.map(h => [h.id, h.lab, h.dia ? `Ø${fmt(h.dia)} × ${fmt(h.dep)}` : "se tegning", fmt(h.pos[0]), fmt(h.pos[1]), fmt(h.pos[2]), entrySide(h.d)]);
  const cols = [["ID", 50], ["Type", 250], ["Ø × dybde", 110], ["X", 70], ["Y", 70], ["Z", 70], ["Retning", 110]];
  const half = rows.length > 16 ? Math.ceil(rows.length / 2) : rows.length;
  const tblH = rows.length ? 50 + 21 * (half + 1) : 0;
  const H = head + Math.max(main.ht + G, restH) + G + tblH + 110;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H; const g = cv.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
  const place = [{ v: main, x: G, y: head + G * 0.6 }]; let y = head + G * 0.6;
  rest.forEach(v => { place.push({ v, x: G + main.w + G, y }); y += v.ht + G; });
  const at = (k, p) => { const q = place.find(q => q.v.key === k); if (!q) return null; const s = q.v.proj(S2G(p)); return [q.x + s[0], q.y + s[1]]; };
  place.forEach(({ v, x, y }) => {
    g.drawImage(v.img, x, y); g.font = `700 15px ${FONT}`; g.fillStyle = INK; g.textAlign = "left"; g.fillText(v.name.toUpperCase(), x, y - 14);
    const L = x + 2, R = x + v.w - 2, T = y + 2, B = y + v.ht - 2;
    dim(g, [L, B], [R, B], -28, fmt(v.size[0])); dim(g, [L, B], [L, T], -28, fmt(v.size[1]));
  });
  (spec.dims || []).forEach(([k, a, b, off, label]) => { const A = at(k, [a[0], a[1], a[2]]), B = at(k, [b[0], b[1], b[2]]); if (A && B) dim(g, A, B, off || 0, label); });
  (spec.notes || []).forEach(([k, p, text, dx, dy]) => { const P = at(k, p); if (P) note(g, P, text, dx === undefined ? 60 : dx, dy === undefined ? -34 : dy); });
  holes.forEach(h => { const v = viewForHole(h, spec.views); if (!v) return; const P = at(v, h.pos); if (P) marker(g, P, h.id, h.kind); });
  if (rows.length) {
    const ty = H - 110 - tblH + 24;
    g.font = `700 15px ${FONT}`; g.fillStyle = INK; g.textAlign = "left";
    g.fillText("HULLER, GEVIND OG INDSATSER  (X/Y/Z i delens koordinater: X bredde, Y dybde fra front, Z højde fra bund)", G, ty - 8);
    const idc = (c, r) => ({ ins: "#b07a12", pilot: "#7a3fb0", clear: "#2a5bd7", cut: "#555" }[holes.find(h => h.id === c)?.kind] || INK);
    table(g, G - 50, ty, cols, rows.slice(0, half), { idColor: idc });
    if (rows.length > half) table(g, G - 50 + 740, ty, cols, rows.slice(half), { idColor: idc });
  }
  frame(g, W, H, spec.title, [["DEL", spec.title], ["MATERIALE", spec.material || "–"], ["FIL", spec.file || "–"], ["REV / MÅL", "G · mm"]]);
  return cv.toDataURL("image/png");
}

// ------------------------------------------------------------------ sheet: assembly (balloons + parts list)
function expandNames(list) {
  const all = []; PACK.traverse(o => { if (o.isMesh) all.push((o.name || o.parent.name || "").replace(/_\d+$/, "")); });
  const uniq = [...new Set(all)];
  return list.flatMap(n => n.endsWith("*") ? uniq.filter(u => u.startsWith(n.slice(0, -1))) : [n]);
}
function assemblySheet(spec) {
  const items = spec.items.map(it => ({ pos: it[0], names: expandNames(it[1]), qty: it[2], name: it[3], mat: it[4] }));
  const names = items.flatMap(i => i.names);
  const obj = build(names, { style: spec.style || "line", place: spec.place, explode: spec.explode, pull: spec.pull, hl: spec.hl });
  const px = spec.px || 2.2;
  const v = renderView(obj, spec.view || "iso", px);
  const listW = 520, G = 150, head = 70;
  const W = G + v.w + G + listW + 40, H = Math.max(v.ht + head + 140, 120 + 26 * (items.length + 2)) + 120;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H; const g = cv.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
  const ox = G, oy = head + 50; g.drawImage(v.img, ox, oy);
  g.font = `700 15px ${FONT}`; g.fillStyle = INK; g.textAlign = "left"; g.fillText((spec.viewName || v.name).toUpperCase(), ox, oy - 14);
  // anchors: centre of each item's first mesh bbox, projected
  const anchors = items.map(it => {
    const b = new THREE.Box3(); obj.children.forEach(c => { if (it.names.includes(c.userData.name) && c.isMesh) { const bb = new THREE.Box3().setFromObject(c); b.union(bb); } });
    if (b.isEmpty()) return null;
    const pick = it.names.length > 6 ? b.getCenter(new THREE.Vector3()) : (() => {        // a vertex near the bbox centre that lies on the part
      const c = b.getCenter(new THREE.Vector3()); let best = null, bd = 1e9;
      obj.children.forEach(m => { if (!m.isMesh || !it.names.includes(m.userData.name)) return; const pa = m.geometry.attributes.position;
        for (let i = 0; i < pa.count; i += Math.max(1, Math.floor(pa.count / 400))) { const p = new THREE.Vector3().fromBufferAttribute(pa, i).add(m.position); const d = p.distanceTo(c); if (d < bd) { bd = d; best = p; } } });
      return best || c; })();
    const s = v.proj(pick); return [ox + s[0], oy + s[1]];
  });
  // balloons in two columns, sorted by height so leaders do not cross
  const left = [], right = []; items.forEach((it, i) => { if (!anchors[i]) return; (anchors[i][0] < ox + v.w / 2 ? left : right).push(i); });
  const spread = (ids, x) => {
    ids.sort((a, b) => anchors[a][1] - anchors[b][1]);
    let y = oy - 10; const step = Math.max(44, Math.min(70, v.ht / Math.max(1, ids.length)));
    ids.forEach(i => { y = Math.max(y + step, anchors[i][1] - 0); y = Math.min(y, oy + v.ht + 40); const p = anchors[i];
      g.strokeStyle = INK; g.lineWidth = 1.1; g.beginPath(); g.moveTo(x, y); g.lineTo(p[0], p[1]); g.stroke();
      g.fillStyle = INK; g.beginPath(); g.arc(p[0], p[1], 3, 0, 7); g.fill();
      g.fillStyle = "#fff"; g.beginPath(); g.arc(x, y, 17, 0, 7); g.fill(); g.lineWidth = 2; g.stroke();
      g.fillStyle = INK; g.font = `700 15px ${FONT}`; g.textAlign = "center"; g.fillText(items[i].pos, x, y + 5); });
  };
  spread(left, ox - 70); spread(right, ox + v.w + 70);
  const tx = ox + v.w + G; g.font = `700 15px ${FONT}`; g.fillStyle = INK; g.textAlign = "left"; g.fillText("STYKLISTE", tx, oy - 14);
  table(g, tx, oy, [["Pos", 46], ["Antal", 54], ["Betegnelse", 250], ["Materiale / type", 170]], items.map(i => [i.pos, i.qty, i.name, i.mat]), { rh: 24 });
  (spec.notes || []).forEach(([p, text, dx, dy]) => { const s = v.proj(S2G(p).add(new THREE.Vector3(0, (spec.place || {}).unit || 0, 0))); note(g, [ox + s[0], oy + s[1]], text, dx, dy); });
  frame(g, W, H, spec.title, [["TEGNING", spec.title], ["OMFANG", spec.scope || "Standardboks"], ["VISNING", spec.viewName || v.name], ["REV / MÅL", "G · mm"]]);
  return cv.toDataURL("image/png");
}

// ------------------------------------------------------------------ sheet: detail (shaded illustration + callouts)
function detailSheet(spec) {
  const panels = spec.panels.map(pn => {
    const names = expandNames(pn.nodes);
    const obj = build(names, { style: "shaded", place: pn.place || spec.place, explode: pn.explode, pull: pn.pull, hl: pn.hl, hlhw: true });
    let box = null;
    if (pn.box) { box = new THREE.Box3(); [S2G(pn.box[0]), S2G(pn.box[1])].forEach(p => box.expandByPoint(p.add(new THREE.Vector3(0, ((pn.place || spec.place) || {})[pn.boxGroup || "unit"] || 0, 0)))); }
    const fitPx = pn.px || 3.2;
    const r = renderView(obj, pn.view, fitPx, box);
    return { pn, r, obj };
  });
  const G = 70, head = 80, gap = 60;
  const W = Math.max(1500, G * 2 + panels.reduce((s, p) => s + p.r.w, 0) + gap * (panels.length - 1));
  const stepsH = 30 + 22 * (spec.steps || []).length;
  const H = head + 40 + Math.max(...panels.map(p => p.r.ht)) + 60 + stepsH + 120;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H; const g = cv.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
  let x = G;
  panels.forEach(({ pn, r }) => {
    const y = head + 40; g.drawImage(r.img, x, y);
    g.font = `700 15px ${FONT}`; g.fillStyle = INK; g.textAlign = "left"; g.fillText((pn.title || r.name).toUpperCase(), x, y - 14);
    (pn.labels || []).forEach(([p, text, dx, dy, grp]) => {
      const gl = S2G(p).add(new THREE.Vector3(0, ((pn.place || spec.place) || {})[grp || "unit"] || 0, 0));
      const s = r.proj(gl); note(g, [x + s[0], y + s[1]], text, dx, dy, pn.labelColor);
    });
    x += r.w + gap;
  });
  if (spec.steps) {
    let y = H - 120 - stepsH + 10; g.font = `700 15px ${FONT}`; g.fillStyle = INK; g.textAlign = "left"; g.fillText("SÅDAN GØR DU", G, y); y += 26;
    spec.steps.forEach((s, i) => { g.font = `700 14px ${FONT}`; g.fillStyle = AMBER; g.fillText(String(i + 1), G, y); g.font = `400 14px ${FONT}`; g.fillStyle = INK; g.fillText(s, G + 24, y); y += 22; });
  }
  frame(g, W, H, spec.title, [["DETALJE", spec.title], ["DELE", spec.parts || "–"], ["FASTGØRELSE", spec.fasteners || "–"], ["REV / MÅL", "G · mm"]]);
  return cv.toDataURL("image/png");
}

window.sheet = spec => (spec.kind === "assembly" ? assemblySheet : spec.kind === "detail" ? detailSheet : partSheet)(spec);
</script>
